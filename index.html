<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Luxury Smartwatch - Standard Edition v2.0.2 Direct Audio Fix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com/">
  <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@500;700&family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;700;900&family=Noto+Serif+KR:wght@400;700;900&display=swap" rel="stylesheet">

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBcADvduLSCtHSeXajTB-IGLmF9iGu8sYc",
      authDomain: "luxury-watch-app-111.firebaseapp.com",
      projectId: "luxury-watch-app-111",
      storageBucket: "luxury-watch-app-111.firebasestorage.app",
      messagingSenderId: "46725089963",
      appId: "1:46725089963:web:9816f9acd7c4f9a6acc5ee",
      measurementId: "G-LDJT8YZKF1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    window.recordedAudioBlob = null;
    window.remoteAudioUrl = '';
    window.aiNarratorBlob = null;
    window.remoteNarratorAudioUrl = '';
    window.aiNarratorObjectUrl = '';
    window.customBackgroundBlob = null;
    window.backgroundPlaylistBlobs = [];
    window.backgroundPlaylist = [];
    window.backgroundRotationTimer = null;
    window.backgroundRotationIndex = 0;
    window.backgroundRotationSeconds = 15;
    window.customBackgroundType = '';
    window.remoteBackgroundUrl = '';
    window.remoteBackgroundType = '';
    window.customMeteorBlob = null;
    window.remoteMeteorUrl = '';
    window.currentRelayCount = 0;
    window.currentRelayHistory = [];
    window.relayCompleted = false;

    const SCHEMA_VERSION = 6;

    function newWatchId() {
      if (window.crypto?.getRandomValues) {
        const a = new Uint32Array(2);
        crypto.getRandomValues(a);
        return 'watch_' + Array.from(a).map(v => v.toString(36)).join('').slice(0, 12);
      }
      return 'watch_' + Math.random().toString(36).slice(2, 12);
    }

    function extFromBlob(blob, fallback = 'bin') {
      const type = blob?.type || '';
      if (type.includes('webm')) return 'webm';
      if (type.includes('mp4')) return 'mp4';
      if (type.includes('mpeg')) return 'mp3';
      if (type.includes('png')) return 'png';
      if (type.includes('jpeg')) return 'jpg';
      if (type.includes('webp')) return 'webp';
      if (type.includes('gif')) return 'gif';
      return fallback;
    }

    async function uploadBlob(path, blob) {
      const fileRef = ref(storage, path);
      await uploadBytes(fileRef, blob, { contentType: blob.type || 'application/octet-stream' });
      return await getDownloadURL(fileRef);
    }

    function normalizeWatchData(raw) {
      if (!raw) return null;
      return {
        schemaVersion: raw.schemaVersion || raw.version || 0,
        text: raw.text ?? raw.t ?? '',
        fontFamily: raw.fontFamily ?? raw.ff ?? "'Noto Sans KR', sans-serif",
        fontSize: raw.fontSize ?? raw.fs ?? '13px',
        textColor: raw.textColor ?? raw.tc ?? '#fbcfe8',
        chime: raw.chime ?? raw.ch ?? 'rooster',
        narrator: raw.narrator ?? 'female',
        narratorAudioUrl: raw.narratorAudioUrl || '',
        audioUrl: raw.audioUrl || '',
        backgroundUrl: raw.backgroundUrl || '',
        backgroundType: raw.backgroundType || '',
        backgroundPlaylist: Array.isArray(raw.backgroundPlaylist) ? raw.backgroundPlaylist : [],
        backgroundRotationSeconds: Number(raw.backgroundRotationSeconds || 15),
        meteorUrl: raw.meteorUrl || '',
        relayCount: Number(raw.relayCount || 0),
        relayHistory: Array.isArray(raw.relayHistory) ? raw.relayHistory : [],
        relayCompleted: !!raw.relayCompleted,
        parentId: raw.parentId || null,
        createdAt: raw.createdAt || '',
        updatedAt: raw.updatedAt || ''
      };
    }

    window.saveToFirestoreAndShare = async function(mode = 'normal') {
      try {
        window.showToast?.('☁️ 클라우드 저장 중...');

        const sourceId = new URLSearchParams(location.search).get('id') || null;
        const docId = newWatchId(); // 항상 새 링크 생성

        const isRelay = mode === 'relay';
        const nextRelayCount = isRelay
          ? Math.max(1, Number(window.currentRelayCount || 0) + 1)
          : Number(window.currentRelayCount || 0);

        const baseRelayHistory = Array.isArray(window.currentRelayHistory)
          ? [...window.currentRelayHistory]
          : [];

        const relayHistory = isRelay
          ? [...baseRelayHistory, {
              step: nextRelayCount,
              fromWatchId: sourceId || null,
              createdAt: new Date().toISOString()
            }].slice(-30)
          : baseRelayHistory.slice(-30);

        let audioUrl = window.remoteAudioUrl || '';
        let narratorAudioUrl = window.remoteNarratorAudioUrl || '';
        let backgroundUrl = window.remoteBackgroundUrl || '';
        let backgroundType = window.remoteBackgroundType || '';
        let meteorUrl = window.remoteMeteorUrl || '';

        // 새 녹음이 있으면 최신 음성 1개로 교체
        if (window.recordedAudioBlob) {
          window.showToast?.('🎙️ 음성 업로드 중...');
          const ext = extFromBlob(window.recordedAudioBlob, 'webm');
          audioUrl = await uploadBlob(`audio_letters/${docId}.${ext}`, window.recordedAudioBlob);
        }

        // AI 내레이터가 새로 생성되었으면 MP3를 Storage에 저장
        if (window.aiNarratorBlob) {
          window.showToast?.('😊 AI 내레이터 음성 업로드 중...');
          narratorAudioUrl = await uploadBlob(`narrators/${docId}.mp3`, window.aiNarratorBlob);
        }

        let backgroundPlaylist = Array.isArray(window.backgroundPlaylist) ? [...window.backgroundPlaylist] : [];

        if (Array.isArray(window.backgroundPlaylistBlobs) && window.backgroundPlaylistBlobs.length) {
          window.showToast?.('🌌 배경 묶음 업로드 중...');
          backgroundPlaylist = [];
          for (let i = 0; i < window.backgroundPlaylistBlobs.length; i++) {
            const item = window.backgroundPlaylistBlobs[i];
            const ext = extFromBlob(item.blob, item.type === 'video' ? 'mp4' : 'jpg');
            const url = await uploadBlob(`backgrounds/${docId}_${i}.${ext}`, item.blob);
            backgroundPlaylist.push({ url, type: item.type });
          }
          if (backgroundPlaylist[0]) {
            backgroundUrl = backgroundPlaylist[0].url;
            backgroundType = backgroundPlaylist[0].type;
          }
        } else if (window.customBackgroundBlob) {
          window.showToast?.('🌌 배경 업로드 중...');
          const ext = extFromBlob(window.customBackgroundBlob, window.customBackgroundType === 'video' ? 'mp4' : 'jpg');
          backgroundUrl = await uploadBlob(`backgrounds/${docId}.${ext}`, window.customBackgroundBlob);
          backgroundType = window.customBackgroundType;
        }

        if (window.customMeteorBlob) {
          window.showToast?.('✨ 초침 이미지 업로드 중...');
          const ext = extFromBlob(window.customMeteorBlob, 'png');
          meteorUrl = await uploadBlob(`meteorites/${docId}.${ext}`, window.customMeteorBlob);
        }

        const watchPackage = {
          schemaVersion: SCHEMA_VERSION,
          text: document.getElementById('dialContentInput').value,
          fontFamily: document.getElementById('fontFamilySelect').value,
          fontSize: document.getElementById('fontSizeSelect').value,
          textColor: document.getElementById('textColorPicker').value,
          chime: document.getElementById('chimeSelect').value,
          narrator: document.getElementById('narratorSelect')?.value || 'female',
          narratorAudioUrl,
          audioUrl,
          backgroundUrl,
          backgroundType,
          backgroundPlaylist,
          backgroundRotationSeconds: Number(document.getElementById('backgroundIntervalSelect')?.value || window.backgroundRotationSeconds || 15),
          meteorUrl,
          relayCount: nextRelayCount,
          relayHistory,
          relayCompleted: mode === 'complete' ? true : !!window.relayCompleted,
          parentId: sourceId,
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString(),

          // 구버전 앱과의 역호환 필드
          t: document.getElementById('dialContentInput').value,
          ff: document.getElementById('fontFamilySelect').value,
          fs: document.getElementById('fontSizeSelect').value,
          tc: document.getElementById('textColorPicker').value,
          ch: document.getElementById('chimeSelect').value
        };

        await setDoc(doc(db, 'watches', docId), watchPackage);

        // 공유 링크는 항상 운영 중인 공식 Vercel 주소를 사용한다.
        // 중요: 카카오톡이 Web Share API의 별도 url 필드에서 쿼리스트링을
        // 누락하는 경우를 피하기 위해, 완전한 ?id=... 주소를 본문 text 안에 직접 넣는다.
        const base = 'https://luxury-watch-app-111.vercel.app/';
        const shareUrl = `${base}?id=${encodeURIComponent(docId)}`;
        const userText = watchPackage.text.trim();
        const relayLine = isRelay ? `\n\n🏃 ${watchPackage.relayCount}번째 릴레이 편지` : '';
        const shareMessage = `[Luxury Smartwatch 편지]${relayLine}\n\n${userText}\n\n👉 시계 열기:\n${shareUrl}`;
        window.__lastShareUrl = shareUrl;
        window.currentRelayCount = watchPackage.relayCount;
        window.currentRelayHistory = watchPackage.relayHistory;
        window.relayCompleted = watchPackage.relayCompleted;
        window.updateRelayBadge?.();

        // 방금 저장한 문서를 즉시 다시 읽어, 링크가 실제로 복원 가능한지 확인한다.
        const verifySnap = await getDoc(doc(db, 'watches', docId));
        if (!verifySnap.exists()) throw new Error('Saved document verification failed');

        try {
          if (navigator.share) {
            await navigator.share({
              title: 'Luxury Smartwatch 편지',
              text: shareMessage
            });
            window.showToast?.('💌 전체 링크가 포함된 공유창을 열었습니다');
            return;
          }
        } catch (_) {}

        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(shareMessage);
          } else {
            const ta = document.createElement('textarea');
            ta.value = shareMessage;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            ta.remove();
          }
          window.showToast?.('📋 카톡용 링크 복사 완료!');
        } catch (err) {
          console.error(err);
          prompt('아래 내용을 복사하세요:', shareMessage);
        }
      } catch (err) {
        console.error('Cloud Sync Error:', err);
        window.showToast?.('❌ 클라우드 저장 실패');
      }
    };

    window.addEventListener('DOMContentLoaded', async () => {
      const queryId = new URLSearchParams(location.search).get('id');
      const hashParams = new URLSearchParams((location.hash || '').replace(/^#/, ''));
      const docId = queryId || hashParams.get('id');

      if (!docId) {
        // 공유 링크라면 반드시 id가 있어야 한다. id가 없으면 상대방의 로컬 상태가
        // 잘못 표시될 수 있으므로 기본 주소 접속임을 명확히 알린다.
        await window.restoreLocalState?.();
        window.showToast?.('ℹ️ 기본 화면입니다 · 공유 링크에는 ?id=watch_...가 필요합니다');
        return;
      }

      window.__openedWatchId = docId;

      try {
        window.showToast?.('📥 편지 불러오는 중...');
        const snap = await getDoc(doc(db, 'watches', docId));
        if (!snap.exists()) {
          window.showToast?.('❌ 존재하지 않는 편지입니다');
          return;
        }

        const data = normalizeWatchData(snap.data());
        window.applyWatchData?.(data);
        window.showToast?.('💌 편지 도착 완료!');
      } catch (err) {
        console.error('Firestore Load Error:', err);
        window.showToast?.('❌ 데이터 로드 오류');
      }
    });
  </script>

<body>
  <div class="viewport-wrapper" id="viewportWrapper">
    <div class="scaler" id="scalerElement">
      <div class="watch-container">
        <div class="strap-top"><div class="strap-gradient"></div></div>

              <div class="dial-sunray" id="dialSunray">
                <div id="backgroundLayer" class="background-layer">
                  <video id="defaultBackground" src="./assets/spring.mp4" class="bg-media-element is-active" autoplay loop muted playsinline preload="auto"></video>

                <div class="top-controls">

                    <label for="filePhotoUpload" class="btn-custom">이미지</label>
                    <input type="file" id="filePhotoUpload" accept="image/*" multiple style="display:none">
                    <label for="fileVideoUpload" class="btn-custom">영상</label>
                    <input type="file" id="fileVideoUpload" accept="video/*" multiple style="display:none">
                    <label for="fileMeteoriteUpload" class="btn-custom">시·분·초침</label>

                    <label for="voiceFileUpload" class="btn-custom">🎧 음성파일</label>
                    <input type="file" id="voiceFileUpload" accept="audio/*,.mp3,.m4a,.wav,.webm,.ogg" style="display:none">
                    <button type="button" id="playAudioBtn" class="btn-custom" onclick="playRecordedAudio()" style="display:none;background:rgba(236,72,153,.9);color:#fff;font-weight:800">▶ 녹음 재생</button>
                    <select id="chimeSelect" class="chime-select" title="정시알림음 선택">
                      <option value="rooster" selected>🐓 닭소리</option>
                      <option value="recorded">🎙 녹음소리</option>
                    </select>
                    <button type="button" class="btn-custom" onclick="testRoosterChime()">🐓 닭소리 테스트</button>
                    <button type="button" class="btn-custom" onclick="testRecordedChime()">🎙 녹음소리 테스트</button>
                  </div>

                  <div id="letterPanel" class="control-panel" style="left:159px;top:80px" hidden>
                    <select id="fontFamilySelect" class="style-select" title="글씨체">
                      <option value="'Noto Serif KR', serif">명조</option>
                      <option value="'Noto Sans KR', sans-serif" selected>고딕</option>
                      <option value="'Nanum Myeongjo', serif">나눔</option>
                      <option value="'Cinzel', serif">로만</option>
                      <option value="'JetBrains Mono', monospace">모노</option>
                    </select>
                    <select id="fontSizeSelect" class="style-select" title="글자 크기">
                      <option value="10px">10px</option><option value="11px">11px</option><option value="12px">12px</option>
                      <option value="13px" selected>13px</option><option value="14px">14px</option><option value="16px">16px</option>
                    </select>
                    <input type="color" id="textColorPicker" class="style-color-picker" value="#fbcfe8" title="글자 색상">
                  </div>

                  <div id="saveSharePanel" class="control-panel" style="left:159px;top:120px" hidden>
                    <button type="button" class="btn-custom" onclick="saveCurrentStateLocally()">저장</button>
                    <button type="button" class="btn-custom" onclick="window.saveToFirestoreAndShare()">카톡링크</button>
                    <button type="button" class="btn-custom" onclick="startRelayShare()">🎁 릴레이 전달</button>
                    <button type="button" class="btn-custom" onclick="completeRelay()">🏁 릴레이 완성</button>
                  </div>
                </div>

                <div class="calendar-window">
                  <div class="cal-year-month" id="calYearMonth">2026 SEP</div>
                  <div class="cal-divider"></div>
                  <div class="cal-day-date"><span class="cal-day-text" id="calDay">WED</span><span class="cal-date-num" id="calDate">16</span></div>
                </div>

                <div id="relayBadge" class="relay-badge"></div>

                <div class="dial-input-container">
                  <textarea class="dial-textarea" id="dialContentInput" rows="5">화사한 벚꽃이 피어나는 봄날,
그대의 미소처럼 따스한 기억들이
가득 피어오르기를 바랍니다.</textarea>
                </div>

                <div class="hand-pivot-container">
                  <div class="hand-hour-wrapper" id="mainHourHand"><div class="hour-gold-tip-wrap"><img id="hourGoldImg" class="hour-gold-tip gold-sync-target" alt="Hour Gold Tip"><span id="hourNumText" class="hand-time-text hour-text">12</span></div></div>
                  <div class="hand-minute-wrapper" id="mainMinuteHand"><div class="minute-gold-tip-wrap"><img id="minGoldImg" class="minute-gold-tip gold-sync-target" alt="Minute Gold Tip"><span id="minNumText" class="hand-time-text minute-text">00</span></div></div>
                  <div class="hand-second-floating" id="secondHandPivot"><div class="second-meteorite-wrap" id="secondMeteoriteWrap"><img id="secGoldImg" class="second-meteorite gold-sync-target" alt="Second Gold Nugget"></div></div>

        <div class="strap-bottom"><div class="strap-gradient-bottom"></div></div>
      </div>

  </div>

  <script>
    window.showToast = function(msg){
      const toast = document.getElementById('watchToast');
      toast.textContent = msg; toast.style.opacity = '1';
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(()=>toast.style.opacity='0',2500);
    };

    window.updateRelayBadge = function(){
      const badge=document.getElementById('relayBadge');
      if(!badge)return;
      const count=Number(window.currentRelayCount||0);
      if(count>0){
        badge.style.display='block';
        badge.textContent=window.relayCompleted ? `🏁 ${count}명 릴레이 완성` : `🏃 ${count}번째 릴레이`;
      }else{
        badge.style.display='none';
        badge.textContent='';
      }
    };

    async function startRelayShare(){
      if(window.relayCompleted){
        window.showToast('🏁 이미 완성된 릴레이입니다');
        return;
      }
      window.showToast('🎁 다음 사람에게 전달할 새 링크를 만듭니다');
      await window.saveToFirestoreAndShare('relay');
    }
    window.startRelayShare=startRelayShare;

    async function completeRelay(){
      const count=Number(window.currentRelayCount||0);
      if(count<1){
        window.showToast('먼저 릴레이 전달을 시작하세요');
        return;
      }
      window.relayCompleted=true;
      window.updateRelayBadge();
      window.showToast(`🏁 ${count}명 릴레이 완성`);
      await window.saveToFirestoreAndShare('complete');
    }
    window.completeRelay=completeRelay;

    const DEFAULT_GOLD_BASE64 = "data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3CradialGradient id='goldGlow' cx='35%25' cy='30%25' r='65%25'%3E%3Cstop offset='0%25' stop-color='%23ffffff'/%3E%3Cstop offset='25%25' stop-color='%23fef08a'/%3E%3Cstop offset='55%25' stop-color='%23eab308'/%3E%3Cstop offset='85%25' stop-color='%23a16207'/%3E%3Cstop offset='100%25' stop-color='%23451a03'/%3E%3C/radialGradient%3E%3C/defs%3E%3Cpath d='M45,12 C62,9 78,22 84,38 C89,52 82,68 76,80 C68,91 48,93 35,88 C20,82 12,68 14,52 C15,36 28,16 45,12 Z' fill='url(%23goldGlow)'/%3E%3C/svg%3E";
    document.querySelectorAll('.gold-sync-target').forEach(img=>img.src=DEFAULT_GOLD_BASE64);

    window.__bgCurrent = document.getElementById('defaultBackground');

    function createBackgroundElement(source,type='image'){
      let el;
      if(type==='video'){
        el=document.createElement('video');
        el.autoplay=true; el.loop=true; el.muted=true; el.playsInline=true; el.preload='auto';
      }else{
        el=document.createElement('img');
        el.decoding='async';
      }
      el.className='bg-media-element';
      el.src=source;
      return el;
    }

    async function waitBackgroundReady(el,type){
      try{
        if(type==='video'){
          await new Promise(resolve=>{
            if(el.readyState>=2) return resolve();
            const done=()=>resolve();
            el.addEventListener('loadeddata',done,{once:true});
            setTimeout(done,2000);
          });
          await el.play().catch(()=>{});
        }else if(el.decode){
          await el.decode().catch(()=>{});
        }
      }catch(_){}
    }

    window.applyBackground = async function(source,type='image',instant=false){
      const layer=document.getElementById('backgroundLayer');
      const mode=document.getElementById('backgroundTransitionSelect')?.value||'soft';
      if(mode==='direct') instant=true;

      const oldEl=window.__bgCurrent;
      const newEl=createBackgroundElement(source,type);
      layer.appendChild(newEl);
      await waitBackgroundReady(newEl,type);

      if(instant || !oldEl){
        newEl.style.transition='none';
        newEl.classList.add('is-active');
        requestAnimationFrame(()=>newEl.style.transition='');
        if(oldEl && oldEl!==newEl){
          try{oldEl.pause?.();}catch(_){}
          oldEl.remove();
        }
      }else{
        newEl.getBoundingClientRect();
        requestAnimationFrame(()=>{
          newEl.classList.add('is-active');
          oldEl.classList.remove('is-active');
          oldEl.classList.add('is-leaving');
          setTimeout(()=>{
            try{oldEl.pause?.();}catch(_){}
            if(oldEl.parentNode===layer) oldEl.remove();
          },1350);
        });
      }
      window.__bgCurrent=newEl;
    };

    function clearBackgroundRotationTimer(){
      if(window.backgroundRotationTimer){
        clearInterval(window.backgroundRotationTimer);
        window.backgroundRotationTimer=null;
      }
    }

    async function showBackgroundAt(index,instant=false){
      const list=window.backgroundPlaylist||[];
      if(!list.length)return;
      window.backgroundRotationIndex=((index%list.length)+list.length)%list.length;
      const item=list[window.backgroundRotationIndex];
      await window.applyBackground(item.url,item.type||'image',instant);
    }

    function startBackgroundRotation(){
      clearBackgroundRotationTimer();
      const list=window.backgroundPlaylist||[];
      if(list.length<2)return;
      const sec=Number(document.getElementById('backgroundIntervalSelect')?.value||window.backgroundRotationSeconds||15);
      window.backgroundRotationSeconds=Math.max(5,sec);
      window.backgroundRotationTimer=setInterval(()=>{
        showBackgroundAt((window.backgroundRotationIndex||0)+1,false);
      },window.backgroundRotationSeconds*1000);
    }

    function toggleBackgroundRotation(){
      if(window.backgroundRotationTimer){
        clearBackgroundRotationTimer();
        window.showToast('⏸ 배경 자동전환 정지');
      }else{
        if((window.backgroundPlaylist||[]).length<2){
          window.showToast('이미지/영상을 2개 이상 선택하세요');
          return;
        }
        startBackgroundRotation();
        window.showToast(`▶ ${window.backgroundRotationSeconds}초 · 부드러운 전환`);
      }
    }
    window.toggleBackgroundRotation=toggleBackgroundRotation;

    window.applyWatchData = function(data){
      const input=document.getElementById('dialContentInput');
      const ff=document.getElementById('fontFamilySelect');
      const fs=document.getElementById('fontSizeSelect');
      const tc=document.getElementById('textColorPicker');
      const ch=document.getElementById('chimeSelect');

      input.value=data.text||'';
      ff.value=data.fontFamily||"'Noto Sans KR', sans-serif"; input.style.fontFamily=ff.value;
      fs.value=data.fontSize||'13px'; input.style.fontSize=fs.value;
      tc.value=data.textColor||'#fbcfe8'; input.style.color=tc.value;
      ch.value=data.chime||'rooster';
      const narrator=document.getElementById('narratorSelect'); if(narrator) narrator.value=data.narrator||'female';

      window.recordedAudioBlob=null;
      window.remoteAudioUrl=data.audioUrl||'';
      window.remoteNarratorAudioUrl=data.narratorAudioUrl||'';
      const playBtn=document.getElementById('playAudioBtn');
      playBtn.style.display=window.remoteAudioUrl?'block':'none';
      playBtn.textContent='▶ 재생음';

      window.customBackgroundBlob=null;
      window.backgroundPlaylistBlobs=[];
      window.remoteBackgroundUrl=data.backgroundUrl||'';
      window.remoteBackgroundType=data.backgroundType||'';
      window.backgroundPlaylist = Array.isArray(data.backgroundPlaylist) && data.backgroundPlaylist.length
        ? data.backgroundPlaylist.map(x=>({url:x.url,type:x.type||'image'}))
        : (window.remoteBackgroundUrl ? [{url:window.remoteBackgroundUrl,type:window.remoteBackgroundType||'image'}] : []);
      window.backgroundRotationSeconds=Number(data.backgroundRotationSeconds||15);
      const intervalSel=document.getElementById('backgroundIntervalSelect');
      if(intervalSel) intervalSel.value=String(window.backgroundRotationSeconds);
      if(window.backgroundPlaylist.length){
        window.backgroundRotationIndex=0;
        showBackgroundAt(0,true);
        startBackgroundRotation();
      }

      window.currentRelayCount=Number(data.relayCount||0);
      window.currentRelayHistory=Array.isArray(data.relayHistory)?data.relayHistory:[];
      window.relayCompleted=!!data.relayCompleted;
      window.updateRelayBadge?.();

      window.customMeteorBlob=null;
      window.remoteMeteorUrl=data.meteorUrl||'';
      if(window.remoteMeteorUrl){
        ['hourGoldImg','minGoldImg','secGoldImg'].forEach(id=>{
          const el=document.getElementById(id);
          if(el) el.src=window.remoteMeteorUrl;
        });
      }
    };

    // ---------- IndexedDB ----------
    const DB_NAME='LuxuryWatchStandardDB', STORE='media', DB_VERSION=1;
    function openDB(){
      return new Promise((resolve,reject)=>{
        const r=indexedDB.open(DB_NAME,DB_VERSION);
        r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains(STORE)) r.result.createObjectStore(STORE); };
        r.onsuccess=()=>resolve(r.result); r.onerror=()=>reject(r.error);
      });
    }
    async function dbPut(key,value){ const db=await openDB(); return new Promise((res,rej)=>{ const tx=db.transaction(STORE,'readwrite'); tx.objectStore(STORE).put(value,key); tx.oncomplete=()=>{db.close();res();}; tx.onerror=()=>{db.close();rej(tx.error);}; }); }
    async function dbGet(key){ const db=await openDB(); return new Promise((res,rej)=>{ const tx=db.transaction(STORE,'readonly'); const q=tx.objectStore(STORE).get(key); q.onsuccess=()=>{const v=q.result;db.close();res(v);}; q.onerror=()=>{db.close();rej(q.error);}; }); }

    async function saveCurrentStateLocally(){
      try{
        localStorage.setItem('LuxuryWatchStandardState',JSON.stringify({
          text:document.getElementById('dialContentInput').value,
          fontFamily:document.getElementById('fontFamilySelect').value,
          fontSize:document.getElementById('fontSizeSelect').value,
          textColor:document.getElementById('textColorPicker').value,
          chime:document.getElementById('chimeSelect').value,
          relayCount:Number(window.currentRelayCount||0),
          relayHistory:Array.isArray(window.currentRelayHistory)?window.currentRelayHistory:[],
          relayCompleted:!!window.relayCompleted,
          savedAt:new Date().toISOString()
        }));
        if(window.recordedAudioBlob) await dbPut('audio',window.recordedAudioBlob);
        if(window.customBackgroundBlob) await dbPut('background',{blob:window.customBackgroundBlob,type:window.customBackgroundType});
        if(window.customMeteorBlob) await dbPut('meteor',window.customMeteorBlob);
        window.showToast('✅ 저장 완료');
      }catch(err){ console.error(err); window.showToast('❌ 저장 실패'); }
    }

    window.restoreLocalState = async function(){
      try{
        const raw=localStorage.getItem('LuxuryWatchStandardState');
        if(raw){
          const s=JSON.parse(raw); const input=document.getElementById('dialContentInput');
          input.value=s.text??input.value;
          if(s.fontFamily){document.getElementById('fontFamilySelect').value=s.fontFamily;input.style.fontFamily=s.fontFamily;}
          if(s.fontSize){document.getElementById('fontSizeSelect').value=s.fontSize;input.style.fontSize=s.fontSize;}
          if(s.textColor){document.getElementById('textColorPicker').value=s.textColor;input.style.color=s.textColor;}
          if(s.chime) document.getElementById('chimeSelect').value=s.chime;
          window.currentRelayCount=Number(s.relayCount||0);
          window.currentRelayHistory=Array.isArray(s.relayHistory)?s.relayHistory:[];
          window.relayCompleted=!!s.relayCompleted;
          window.updateRelayBadge?.();
        }
        const audio=await dbGet('audio'); if(audio){window.recordedAudioBlob=audio; const b=document.getElementById('playAudioBtn'); b.style.display='block'; b.textContent='▶ 재생음';}
        const bg=await dbGet('background'); if(bg?.blob){window.customBackgroundBlob=bg.blob;window.customBackgroundType=bg.type;window.applyBackground(URL.createObjectURL(bg.blob),bg.type);}
        const meteor=await dbGet('meteor');
        if(meteor){
          window.customMeteorBlob=meteor;
          const handUrl=URL.createObjectURL(meteor);
          ['hourGoldImg','minGoldImg','secGoldImg'].forEach(id=>{
            const el=document.getElementById(id);
            if(el) el.src=handUrl;
          });
        }
        if(raw||audio||bg||meteor) window.showToast('💾 저장 상태 복원 완료');
      }catch(err){console.error('restore error',err);}
    };

    document.getElementById('filePhotoUpload').addEventListener('change',e=>{
      const files=[...e.target.files];
      if(!files.length)return;
      const items=files.map(f=>({blob:f,type:'image',url:URL.createObjectURL(f)}));
      window.backgroundPlaylistBlobs=[...(window.backgroundPlaylistBlobs||[]),...items.map(x=>({blob:x.blob,type:x.type}))];

    // ---------- 녹음 v2.0.2 : Direct / Maximum Compatibility ----------
    // Web Audio 가공을 거치지 않고 마이크 스트림을 MediaRecorder에 직접 연결한다.
    // Chrome / Edge / Android / Safari 계열에서 재생 호환성을 우선한다.
    let mediaRecorder = null;
    let audioChunks = [];
    let recordingSourceStream = null;
    let currentAudio = null;
    let currentObjectUrl = null;

    function getBestRecordingOptions() {
      const candidates = [
        'audio/webm;codecs=opus',
        'audio/mp4',
        'audio/webm',
        'audio/ogg;codecs=opus'
      ];
      for (const mimeType of candidates) {
        try {
          if (window.MediaRecorder?.isTypeSupported?.(mimeType)) {
            return { mimeType, audioBitsPerSecond: 128000 };
          }
        } catch (_) {}
      }
      return {};
    }

    function cleanupCurrentAudio(){
      try{
        if(currentAudio){
          currentAudio.pause();
          currentAudio.src = '';
          currentAudio.load();
        }
      }catch(_){}
      currentAudio = null;

      if(currentObjectUrl){
        try{ URL.revokeObjectURL(currentObjectUrl); }catch(_){}
        currentObjectUrl = null;
      }
    }

    function stopMicTracks(){
      try{
        recordingSourceStream?.getTracks()?.forEach(t=>t.stop());
      }catch(_){}
      recordingSourceStream = null;
    }

    async function toggleRecording() {
      const recordBtn = document.getElementById('recordBtn');

      if (mediaRecorder && mediaRecorder.state === 'recording') {
        recordBtn.disabled = true;
        recordBtn.textContent = '처리 중...';
        try { mediaRecorder.requestData?.(); } catch (_) {}
        mediaRecorder.stop();
        return;
      }

      try {
        if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
          window.showToast('❌ 이 브라우저는 녹음을 지원하지 않습니다');
          return;
        }

        cleanupCurrentAudio();
        window.recordedAudioBlob = null;
        window.remoteAudioUrl = '';
        audioChunks = [];

        recordingSourceStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
            channelCount: 1
          }
        });

        const opts = getBestRecordingOptions();
        try {
          mediaRecorder = Object.keys(opts).length
            ? new MediaRecorder(recordingSourceStream, opts)
            : new MediaRecorder(recordingSourceStream);
        } catch (_) {
          mediaRecorder = new MediaRecorder(recordingSourceStream);
        }

        mediaRecorder.ondataavailable = e => {
          if (e.data && e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onerror = e => {
          console.error('MediaRecorder error:', e);
          stopMicTracks();
          recordBtn.disabled = false;
          recordBtn.classList.remove('recording');
          recordBtn.textContent = '🎙 녹음';
          window.showToast('❌ 녹음 오류');
        };

        mediaRecorder.onstop = () => {
          const mime = mediaRecorder?.mimeType || audioChunks[0]?.type || 'audio/webm';
          const blob = new Blob(audioChunks, { type: mime });

          stopMicTracks();
          recordBtn.disabled = false;
          recordBtn.classList.remove('recording');
          recordBtn.textContent = '🎙 녹음';

          if (!blob.size) {
            window.recordedAudioBlob = null;
            window.showToast('❌ 녹음 데이터가 없습니다');
            return;
          }

          window.recordedAudioBlob = blob;
          window.remoteAudioUrl = '';

          const playBtn = document.getElementById('playAudioBtn');
          if (playBtn) {
            playBtn.style.display = 'block';
            playBtn.textContent = '▶ 녹음 재생';
          }

          const kb = Math.max(1, Math.round(blob.size / 1024));
          window.showToast(`✅ 녹음 완료 · ${kb}KB · 재생 버튼을 누르세요`);
        };

        // timeslice 없이 녹음하여 마지막 파일 헤더/메타데이터 호환성을 높임
        mediaRecorder.start();

        recordBtn.disabled = false;
        recordBtn.classList.add('recording');
        recordBtn.textContent = '■ 녹음 중지';
        window.showToast('🔴 녹음 중입니다');

      } catch (err) {
        console.error('Mic start error:', err);
        stopMicTracks();
        recordBtn.disabled = false;
        recordBtn.classList.remove('recording');
        recordBtn.textContent = '🎙 녹음';

        if (err?.name === 'NotAllowedError' || err?.name === 'SecurityError') {
          window.showToast('❌ 마이크 권한을 허용해주세요');
        } else {
          window.showToast('❌ 마이크 시작 실패');
        }
      }
    }
    window.toggleRecording = toggleRecording;

    async function playRecordedAudio() {

      if (window.recordedAudioBlob?.size) {
        currentObjectUrl = URL.createObjectURL(window.recordedAudioBlob);

      } else if (window.remoteAudioUrl) {
        src = window.remoteAudioUrl;
      }

      if (!src) {

      try {

          currentAudio = document.createElement('audio');
          currentAudio.id = 'recordedAudioPlayer';
          currentAudio.playsInline = true;
          currentAudio.preload = 'auto';

          document.body.appendChild(currentAudio);

        currentAudio.pause();
        currentAudio.src = src;
        currentAudio.volume = 1;
        currentAudio.muted = false;
        currentAudio.load();

        // 재생 버튼 자체의 사용자 클릭 이벤트 안에서 바로 play() 호출.

        currentAudio.onended = () => {

          window.showToast('❌ 이 녹음 형식을 재생할 수 없습니다');

    // 기본: Vercel /api/tts -> OpenAI TTS MP3
    // 실패 시: 브라우저 speechSynthesis fallback
    let narrationUtterance = null;
    let currentNarratorAudio = null;
    let narratorRequestController = null;
    let cachedNarratorVoices = [];
    const NARRATOR_STYLE_VERSION = 'pro-voice-v1';
    window.aiNarratorStyleVersion = '';

    function refreshNarratorVoices(){
      if(!('speechSynthesis' in window)) return [];
      cachedNarratorVoices = speechSynthesis.getVoices() || [];
      return cachedNarratorVoices;
    }

    function getKoreanVoices(){
      return refreshNarratorVoices().filter(v =>
        /^ko(?:-|_)/i.test(v.lang || '') || /korean|한국/i.test(v.name || '')
      );
    }

    function chooseFallbackVoice(gender){
      const ko = getKoreanVoices();
      if(!ko.length) return null;
      const maleHints = ['male','man','minsu','minjun','injoon','hyunsu','seojun','woojin','남성','남자'];
      const femaleHints = ['female','woman','yuna','sora','sunhi','heami','yuri','seoyeon','jiyeon','여성','여자'];
      const hints = gender === 'male' ? maleHints : femaleHints;
      return ko.find(v => hints.some(h => (v.name || '').toLowerCase().includes(h.toLowerCase())))
        || (gender === 'female' ? ko[0] : null);
    }

    function makeWarmNarrationText(rawText){
      return rawText
        .replace(/\r\n/g, '\n')
        .replace(/\n{2,}/g, '. ')
        .replace(/\n/g, ', ')
        .replace(/([.!?])\s*/g, '$1  ')
        .replace(/,{2,}/g, ',')
        .replace(/\s{3,}/g, '  ')
        .trim();
    }

    function stopNarration(){
      try { narratorRequestController?.abort(); } catch(_) {}
      narratorRequestController = null;

      if(currentNarratorAudio){
        try { currentNarratorAudio.pause(); currentNarratorAudio.currentTime = 0; } catch(_) {}
        currentNarratorAudio = null;
      }

      if('speechSynthesis' in window){
        try { speechSynthesis.cancel(); } catch(_) {}
      }

      window.showToast('■ 내레이터 정지');
    }

    async function browserNarratorFallback(rawText, gender, mood='warm'){
      if(!('speechSynthesis' in window)){
        window.showToast('❌ AI 음성 생성 실패');
        return;
      }

      try { speechSynthesis.resume(); } catch(_) {}
      speechSynthesis.cancel();

      narrationUtterance = new SpeechSynthesisUtterance(makeWarmNarrationText(rawText));
      narrationUtterance.lang = 'ko-KR';
      narrationUtterance.volume = 1.0;
      const moodRate = mood === 'calm' ? 0.88 : (mood === 'bright' ? 1.00 : 0.94);
      narrationUtterance.rate = moodRate;
      narrationUtterance.pitch = gender === 'male' ? 0.90 : 1.03;

      const voice = chooseFallbackVoice(gender);
      if(voice) narrationUtterance.voice = voice;

      narrationUtterance.onstart = () =>
        window.showToast('📱 브라우저 예비 음성으로 재생 중');
      narrationUtterance.onend = () =>
        window.showToast('💌 내레이터 읽기 완료');
      narrationUtterance.onerror = () =>
        window.showToast('❌ 내레이터 재생 오류');

      setTimeout(() => {
        try {
          speechSynthesis.resume();
          speechSynthesis.speak(narrationUtterance);
        } catch(_) {
          window.showToast('❌ 내레이터 실행 실패');
        }
      }, 80);
    }

    async function playNarration(){
      const rawText = document.getElementById('dialContentInput').value.trim();
      if(!rawText){
        window.showToast('읽을 편지 내용이 없습니다');
        return;

      const gender = document.getElementById('narratorSelect')?.value || 'female';
      const mood = document.getElementById('narratorMoodSelect')?.value || 'warm';
      const cacheKey = `${NARRATOR_STYLE_VERSION}|${gender}|${mood}|${rawText}`;

      // 같은 문장으로 이미 생성한 로컬 AI 음성이 있으면 API를 다시 호출하지 않는다.
      if(window.aiNarratorBlob && window.aiNarratorStyleVersion === NARRATOR_STYLE_VERSION && window.aiNarratorCacheKey === cacheKey){
        try {
          await playAiNarratorBlob(window.aiNarratorBlob, gender);

        }
      }

      // 공유받은 링크에 저장된 AI 내레이터가 있으면 그대로 재생한다.

        try {
          await playRemoteNarrator(window.remoteNarratorAudioUrl, gender);
          return;

          console.warn('Remote AI narrator play failed:', err);
        }
      }

      stopNarration();
      window.showToast('✨ AI 내레이터 생성 중...');

      try {
        narratorRequestController = new AbortController();

        const res = await fetch('/api/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            text: rawText,
            gender,
            style: 'professional',
            mood,
            styleVersion: NARRATOR_STYLE_VERSION
          }),
          signal: narratorRequestController.signal
        });

        if(!res.ok){
          let message = `TTS ${res.status}`;
          try {
            const data = await res.json();
            message = data?.error || message;
          } catch(_) {}
          throw new Error(message);
        }

        const blob = await res.blob();
        if(!blob.size) throw new Error('빈 음성 파일');

        window.aiNarratorBlob = new Blob([blob], { type: blob.type || 'audio/mpeg' });
        window.aiNarratorStyleVersion = NARRATOR_STYLE_VERSION;
        window.aiNarratorCacheKey = cacheKey;
        window.remoteNarratorAudioUrl = '';

        try { await idbSet('aiNarratorAudio', window.aiNarratorBlob); } catch(_) {}

        await playAiNarratorBlob(window.aiNarratorBlob, gender);

      } catch(err) {
        if(err?.name === 'AbortError') return;
        console.error('AI Narrator error:', err);
        window.showToast('⚠️ AI 음성 실패 · 예비 음성 사용');
        await browserNarratorFallback(rawText, gender, mood);
      } finally {
        narratorRequestController = null;
      }
    }

    async function unlockChimeAudio(){
      try{
        const AC=window.AudioContext||window.webkitAudioContext;
        if(!AC)return false;
        if(!chimeAudioContext||chimeAudioContext.state==='closed') chimeAudioContext=new AC();
        if(chimeAudioContext.state==='suspended') await chimeAudioContext.resume();
        return true;
      }catch(e){
        console.warn('chime unlock failed',e);
        return false;
      }
    }

    ['pointerdown','touchstart','click'].forEach(evt=>{

    });

    async function playRoosterChime(){
      try{
        if(!(await unlockChimeAudio())) throw new Error('audio context unavailable');
        const ctx=chimeAudioContext;
        const now=ctx.currentTime+0.03;
        const phrases=[
          {t:0.00,a:500,b:780,c:430,d:0.30,g:0.20},
          {t:0.34,a:580,b:930,c:500,d:0.34,g:0.22},
          {t:0.72,a:650,b:1100,c:550,d:0.42,g:0.24},
          {t:1.20,a:540,b:860,c:390,d:0.55,g:0.20}
        ];
        phrases.forEach(p=>{
          const osc=ctx.createOscillator(), gain=ctx.createGain(), filter=ctx.createBiquadFilter();
          osc.type='sawtooth';
          filter.type='lowpass'; filter.frequency.value=2300;
          osc.frequency.setValueAtTime(p.a,now+p.t);
          osc.frequency.exponentialRampToValueAtTime(p.b,now+p.t+p.d*0.38);
          osc.frequency.exponentialRampToValueAtTime(p.c,now+p.t+p.d);
          gain.gain.setValueAtTime(0.0001,now+p.t);
          gain.gain.exponentialRampToValueAtTime(p.g,now+p.t+0.025);
          gain.gain.exponentialRampToValueAtTime(0.0001,now+p.t+p.d);
          osc.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
          osc.start(now+p.t); osc.stop(now+p.t+p.d+0.03);
        });
        return true;
      }catch(e){
        console.error('Rooster chime error',e);
        window.showToast('🐓 소리 재생 실패 · 화면을 한 번 터치 후 다시 테스트하세요');
        return false;
      }
    }

    contentInput.addEventListener('input', () => {
      window.aiNarratorBlob = null;
      window.remoteNarratorAudioUrl = '';
    });

    const hourHand=document.getElementById('mainHourHand'),minHand=document.getElementById('mainMinuteHand'),secPivot=document.getElementById('secondHandPivot'),secondMeteoriteWrap=document.getElementById('secondMeteoriteWrap');
    const hourNumText=document.getElementById('hourNumText'),minNumText=document.getElementById('minNumText');
    const calYearMonth=document.getElementById('calYearMonth'),calDay=document.getElementById('calDay'),calDate=document.getElementById('calDate');
    const monthNames=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'],dayNames=['SUN','MON','TUE','WED','THU','FRI','SAT'];
    function tickWatch(){
      const now=new Date(),h=now.getHours(),m=now.getMinutes(),s=now.getSeconds(),ms=now.getMilliseconds();
      checkHourlyChime(now);
      const secAngle=-((s+ms/1000)/60)*360,minAngle=((m+s/60)/60)*360,hourAngle=(((h%12)+m/60)/12)*360;
      secPivot.style.transform=`rotate(${secAngle}deg)`; minHand.style.transform=`rotate(${minAngle}deg)`; hourHand.style.transform=`rotate(${hourAngle}deg)`;
      secondMeteoriteWrap.style.transform=`translate(-50%,-50%) rotate(${-secAngle}deg)`;
      hourNumText.innerText=h%12===0?12:h%12; minNumText.innerText=String(m).padStart(2,'0');
      hourNumText.style.transform=`rotate(-${hourAngle}deg)`; minNumText.style.transform=`rotate(-${minAngle}deg)`;
      calYearMonth.innerText=`${now.getFullYear()} ${monthNames[now.getMonth()]}`; calDay.innerText=dayNames[now.getDay()]; calDate.innerText=String(now.getDate()).padStart(2,'0');
      requestAnimationFrame(tickWatch);
    }
    requestAnimationFrame(tickWatch);
  </script>
</body>
</html>
