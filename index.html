<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>TIME RELAY - 이어쓰는 시계편지 v3.1.1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com/">
  <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@500;700&family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;700;900&family=Noto+Serif+KR:wght@400;700;900&display=swap" rel="stylesheet">

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBcADvduLSCtHSeXajTB-IGLmF9iGu8sYc",
      authDomain: "luxury-watch-app-111.firebaseapp.com",
      projectId: "luxury-watch-app-111",
      storageBucket: "luxury-watch-app-111.firebasestorage.app",
      messagingSenderId: "46725089963",
      appId: "1:46725089963:web:9816f9acd7c4f9a6acc5ee",
      measurementId: "G-LDJT8YZKF1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    window.recordedAudioBlob = null;
    window.recordedAudioSource = '';
    window.remoteAudioUrl = '';
    window.screenRecordingBlob = null;
    window.aiNarratorBlob = null;
    window.remoteNarratorAudioUrl = '';
    window.aiNarratorObjectUrl = '';
    window.customBackgroundBlob = null;
    window.backgroundPlaylistBlobs = [];
    window.backgroundPlaylist = [];
    window.backgroundRotationTimer = null;
    window.backgroundRotationIndex = 0;
    window.backgroundRotationSeconds = 15;
    window.customBackgroundType = '';
    window.remoteBackgroundUrl = '';
    window.remoteBackgroundType = '';
    window.customMeteorBlob = null;
    window.remoteMeteorUrl = '';
    window.currentRelayCount = 0;
    window.currentRelayHistory = [];
    window.relayCompleted = false;
    window.storyScenes = [];
    window.storyPlaybackTimer = null;
    window.storyPlaybackAudio = null;
    window.storyPlaybackIndex = -1;

    const SCHEMA_VERSION = 8;

    function newWatchId() {
      if (window.crypto?.getRandomValues) {
        const a = new Uint32Array(2);
        crypto.getRandomValues(a);
        return 'watch_' + Array.from(a).map(v => v.toString(36)).join('').slice(0, 12);
      }
      return 'watch_' + Math.random().toString(36).slice(2, 12);
    }

    function extFromBlob(blob, fallback = 'bin') {
      const type = blob?.type || '';
      if (type.includes('webm')) return 'webm';
      if (type.includes('mp4')) return 'mp4';
      if (type.includes('mpeg')) return 'mp3';
      if (type.includes('png')) return 'png';
      if (type.includes('jpeg')) return 'jpg';
      if (type.includes('webp')) return 'webp';
      if (type.includes('gif')) return 'gif';
      return fallback;
    }

    async function uploadBlob(path, blob) {
      const fileRef = ref(storage, path);
      await uploadBytes(fileRef, blob, { contentType: blob.type || 'application/octet-stream' });
      return await getDownloadURL(fileRef);
    }

    function normalizeWatchData(raw) {
      if (!raw) return null;
      return {
        schemaVersion: raw.schemaVersion || raw.version || 0,
        text: raw.text ?? raw.t ?? '',
        fontFamily: raw.fontFamily ?? raw.ff ?? "'Noto Sans KR', sans-serif",
        fontSize: raw.fontSize ?? raw.fs ?? '13px',
        textColor: raw.textColor ?? raw.tc ?? '#fbcfe8',
        chime: raw.chime ?? raw.ch ?? 'none',
        narrator: raw.narrator ?? 'female',
        narratorAudioUrl: raw.narratorAudioUrl || '',
        audioUrl: raw.audioUrl || '',
        backgroundUrl: raw.backgroundUrl || '',
        backgroundType: raw.backgroundType || '',
        backgroundPlaylist: Array.isArray(raw.backgroundPlaylist) ? raw.backgroundPlaylist : [],
        backgroundRotationSeconds: Number(raw.backgroundRotationSeconds || 15),
        meteorUrl: raw.meteorUrl || '',
        relayCount: Number(raw.relayCount || 0),
        relayHistory: Array.isArray(raw.relayHistory) ? raw.relayHistory : [],
        relayCompleted: !!raw.relayCompleted,
        parentId: raw.parentId || null,
        uiPositions: raw.uiPositions && typeof raw.uiPositions === 'object' ? raw.uiPositions : null,
        storyScenes: Array.isArray(raw.storyScenes) ? raw.storyScenes : [],
        storyEmotion: raw.storyEmotion || 'memory',
        storyTimeTag: raw.storyTimeTag || 'now',
        createdAt: raw.createdAt || '',
        updatedAt: raw.updatedAt || ''
      };
    }


    // 완성본용: 마지막 watch에서 parentId를 따라 1번까지 역추적한 뒤
    // 작성 순서대로 반환한다.
    window.loadCompletedRelayChain = async function(finalWatchId){
      const chain=[];
      const seen=new Set();
      let currentId=finalWatchId || '';

      while(currentId && !seen.has(currentId) && chain.length < 50){
        seen.add(currentId);
        const snap=await getDoc(doc(db,'watches',currentId));
        if(!snap.exists()) break;

        const data=normalizeWatchData(snap.data());
        chain.push({
          id: currentId,
          ...data
        });
        currentId=data.parentId || '';
      }

      chain.reverse();
      return chain;
    };

    window.saveToFirestoreAndShare = async function(mode = 'normal') {
      window.ensureCurrentSceneCaptured?.();
      const needsMediaRightsCheck =
        !!window.recordedAudioBlob &&
        (window.recordedAudioSource === 'screen' || window.recordedAudioSource === 'file' ||
         (window.recordedAudioBlob.type || '').startsWith('video/'));
      if (needsMediaRightsCheck && !requireCopyrightConsent()) return;
      try {
        window.showToast?.(
          mode === 'complete'
            ? '🏁 최종 완성 처리 중...'
            : '☁️ 저장 중...'
        );

        const sourceId = new URLSearchParams(location.search).get('id') || null;
        const docId = newWatchId(); // 항상 새 링크 생성

        const isContribution = mode === 'relay' || mode === 'save' || mode === 'complete';
        const isRelay = isContribution;
        const nextRelayCount = isContribution
          ? Math.max(1, Number(window.currentRelayCount || 0) + 1)
          : Number(window.currentRelayCount || 0);

        const baseRelayHistory = Array.isArray(window.currentRelayHistory)
          ? [...window.currentRelayHistory]
          : [];

        const relayHistory = isRelay
          ? [...baseRelayHistory, {
              step: nextRelayCount,
              fromWatchId: sourceId || null,
              createdAt: new Date().toISOString()
            }].slice(-30)
          : baseRelayHistory.slice(-30);

        let audioUrl = window.remoteAudioUrl || '';
        let narratorAudioUrl = window.remoteNarratorAudioUrl || '';
        let backgroundUrl = window.remoteBackgroundUrl || '';
        let backgroundType = window.remoteBackgroundType || '';
        let meteorUrl = window.remoteMeteorUrl || '';

        // 새 녹음이 있으면 최신 음성 1개로 교체
        if (window.recordedAudioBlob) {
          const isScreenRecording = (window.recordedAudioBlob.type || '').startsWith('video/');
          window.showToast?.(isScreenRecording ? '📱 화면녹화 소리 업로드 중...' : '🎙️ 음성 업로드 중...');
          const ext = extFromBlob(window.recordedAudioBlob, isScreenRecording ? 'mp4' : 'webm');
          audioUrl = await uploadBlob(`audio_letters/${docId}.${ext}`, window.recordedAudioBlob);
        }

        // AI 내레이터가 새로 생성되었으면 MP3를 Storage에 저장
        if (window.aiNarratorBlob) {
          window.showToast?.('😊 AI 내레이터 음성 업로드 중...');
          narratorAudioUrl = await uploadBlob(`narrators/${docId}.mp3`, window.aiNarratorBlob);
        }

        let backgroundPlaylist = Array.isArray(window.backgroundPlaylist) ? [...window.backgroundPlaylist] : [];

        if (Array.isArray(window.backgroundPlaylistBlobs) && window.backgroundPlaylistBlobs.length) {
          window.showToast?.('🌌 배경 묶음 업로드 중...');
          backgroundPlaylist = [];
          for (let i = 0; i < window.backgroundPlaylistBlobs.length; i++) {
            const item = window.backgroundPlaylistBlobs[i];
            const ext = extFromBlob(item.blob, item.type === 'video' ? 'mp4' : 'jpg');
            const url = await uploadBlob(`backgrounds/${docId}_${i}.${ext}`, item.blob);
            backgroundPlaylist.push({ url, type: item.type });
          }
          if (backgroundPlaylist[0]) {
            backgroundUrl = backgroundPlaylist[0].url;
            backgroundType = backgroundPlaylist[0].type;
          }
        } else if (window.customBackgroundBlob) {
          window.showToast?.('🌌 배경 업로드 중...');
          const ext = extFromBlob(window.customBackgroundBlob, window.customBackgroundType === 'video' ? 'mp4' : 'jpg');
          backgroundUrl = await uploadBlob(`backgrounds/${docId}.${ext}`, window.customBackgroundBlob);
          backgroundType = window.customBackgroundType;
        }

        if (window.customMeteorBlob) {
          window.showToast?.('✨ 초침 이미지 업로드 중...');
          const ext = extFromBlob(window.customMeteorBlob, 'png');
          meteorUrl = await uploadBlob(`meteorites/${docId}.${ext}`, window.customMeteorBlob);
        }

        // 장면 데이터는 기존 배경/소리 기능을 복제하지 않고,
        // 각 장면이 어느 배경과 어떤 음성을 사용했는지만 연결한다.
        let storyScenes = Array.isArray(window.storyScenes)
          ? window.storyScenes.map(scene => ({...scene}))
          : [];
        if (storyScenes.length && audioUrl) {
          const last = storyScenes[storyScenes.length - 1];
          if (last?.hasAudio && !last.audioUrl) {
            last.audioUrl = audioUrl;
          }
        }

        const watchPackage = {
          schemaVersion: SCHEMA_VERSION,
          text: document.getElementById('dialContentInput').value,
          fontFamily: document.getElementById('fontFamilySelect').value,
          fontSize: document.getElementById('fontSizeSelect').value,
          textColor: document.getElementById('textColorPicker').value,
          chime: (document.getElementById('chimeSelect')?.value||'none'),
          narrator: document.getElementById('narratorSelect')?.value || 'female',
          narratorAudioUrl,
          audioUrl,
          backgroundUrl,
          backgroundType,
          backgroundPlaylist,
          backgroundRotationSeconds: Number(document.getElementById('backgroundIntervalSelect')?.value || window.backgroundRotationSeconds || 15),
          meteorUrl,
          relayCount: nextRelayCount,
          relayHistory,
          relayCompleted: mode === 'complete' ? true : !!window.relayCompleted,
          parentId: sourceId,
          uiPositions: window.getCurrentUIPositions?.() || null,
          storyScenes,
          storyEmotion: document.getElementById('emotionTagSelect')?.value || 'memory',
          storyTimeTag: document.getElementById('timeTagSelect')?.value || 'now',
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString(),

          // 구버전 앱과의 역호환 필드
          t: document.getElementById('dialContentInput').value,
          ff: document.getElementById('fontFamilySelect').value,
          fs: document.getElementById('fontSizeSelect').value,
          tc: document.getElementById('textColorPicker').value,
          ch: (document.getElementById('chimeSelect')?.value||'none')
        };

        await setDoc(doc(db, 'watches', docId), watchPackage);

        // 공유 링크는 항상 운영 중인 공식 Vercel 주소를 사용한다.
        // 중요: 카카오톡이 Web Share API의 별도 url 필드에서 쿼리스트링을
        // 누락하는 경우를 피하기 위해, 완전한 ?id=... 주소를 본문 text 안에 직접 넣는다.
        const base = 'https://luxury-watch-app-111.vercel.app/';
        const shareUrl = `${base}?id=${encodeURIComponent(docId)}`;
        const userText = watchPackage.text.trim();
        const relayLine = mode === 'complete'
          ? `\n\n🏁 ${watchPackage.relayCount}명 릴레이 완성`
          : (isRelay ? `\n\n🏃 ${watchPackage.relayCount}번째 릴레이 편지` : '');
        const shareMessage = `[TIME RELAY · 이어쓰는 시계편지]${relayLine}\n\n${userText}\n\n👉 시계 열기:\n${shareUrl}`;
        window.__lastShareUrl = shareUrl;
        window.currentRelayCount = watchPackage.relayCount;
        window.currentRelayHistory = watchPackage.relayHistory;
        window.relayCompleted = watchPackage.relayCompleted;
        window.storyScenes = storyScenes;
        window.updateRelayBadge?.();
        window.updateStorySceneUI?.();

        // 방금 저장한 문서를 즉시 다시 읽어, 링크가 실제로 복원 가능한지 확인한다.
        const verifySnap = await getDoc(doc(db, 'watches', docId));
        if (!verifySnap.exists()) throw new Error('Saved document verification failed');

        if (mode === 'save' || mode === 'complete') {
          window.__lastShareUrl = shareUrl;
          window.__lastShareMessage = shareMessage;
          window.__lastSavedDocId = docId;

          const box=document.getElementById('savedLinkBox');
          const input=document.getElementById('savedLinkInput');
          const title=document.querySelector('#savedLinkBox .saved-link-title');

          if(input) input.value=shareUrl;
          if(box) box.hidden=false;

          if(mode === 'complete'){
            if(title) title.textContent=`🏁 ${watchPackage.relayCount}명 릴레이 완성`;
            window.setCompletedUI?.(watchPackage.relayCount, shareUrl);
            window.showToast?.(`🏁 ${watchPackage.relayCount}명 릴레이 완성`);
          }else{
            if(title) title.textContent='링크 생성 완료';
            window.restoreActiveRelayUI?.();
            window.showToast?.('✅ 저장 완료 · 링크가 생성되었습니다');
          }
          return shareUrl;
        }

        try {
          if (navigator.share) {
            await navigator.share({
              title: 'TIME RELAY · 이어쓰는 시계편지',
              text: shareMessage
            });
            window.showToast?.('💌 전체 링크가 포함된 공유창을 열었습니다');
            return;
          }
        } catch (_) {}

        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(shareMessage);
          } else {
            const ta = document.createElement('textarea');
            ta.value = shareMessage;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            ta.remove();
          }
          window.showToast?.('📋 카톡용 링크 복사 완료!');
        } catch (err) {
          console.error(err);
          prompt('아래 내용을 복사하세요:', shareMessage);
        }
      } catch (err) {
        console.error('Cloud Sync Error:', err);
        window.showToast?.('❌ 클라우드 저장 실패');
      }
    };

    
    window.addEventListener('DOMContentLoaded', () => {
      const btn = document.getElementById('recordBtn');
      if (btn) btn.title = '녹음 시작';
    });

window.addEventListener('DOMContentLoaded', async () => {
      const queryId = new URLSearchParams(location.search).get('id');
      const hashParams = new URLSearchParams((location.hash || '').replace(/^#/, ''));
      const docId = queryId || hashParams.get('id');

      if (!docId) {
        // 공유 링크라면 반드시 id가 있어야 한다. id가 없으면 상대방의 로컬 상태가
        // 잘못 표시될 수 있으므로 기본 주소 접속임을 명확히 알린다.
        await window.restoreLocalState?.();
        window.showToast?.('ℹ️ 기본 화면입니다 · 공유 링크에는 ?id=watch_...가 필요합니다');
        return;
      }

      window.__openedWatchId = docId;
      window.__isSharedRelayPage = true;

      // 공유 링크를 여는 순간부터 "새 작성자" 상태로 고정한다.
      // Firestore 로딩 전에 글쓰기 버튼을 눌러도 이전 글이 보이지 않는다.
      window.__incomingRelay = true;
      window.__currentContributionStarted = false;
      window.previousRelayText = '';
      window.previousRelayAudioUrl = '';
      const incomingInput = document.getElementById('dialContentInput');
      if(incomingInput){
        incomingInput.value = '';
        incomingInput.dataset.relayPrepared = '1';
        incomingInput.placeholder = '새 이야기를 남겨주세요';
      }

      try {
        window.showToast?.('📥 편지 불러오는 중...');
        const snap = await getDoc(doc(db, 'watches', docId));
        if (!snap.exists()) {
          window.showToast?.('❌ 존재하지 않는 편지입니다');
          return;
        }

        const data = normalizeWatchData(snap.data());
        window.applyWatchData?.(data);

        // 받은 편지는 원본 데이터로 그대로 보존하고,
        // 다음 작성자는 항상 빈 입력칸에서 새 이야기를 시작한다.
        window.previousRelayText = data.text || '';
        window.previousRelayAudioUrl = data.audioUrl || '';
        window.__incomingRelay = true;
        window.__isSharedRelayPage = true;
        window.__currentContributionStarted = false;

        const input = document.getElementById('dialContentInput');
        if (input) {
          // 이전 작성자의 내용은 절대 현재 입력칸으로 복원하지 않는다.
          input.value = '';
          const nextOrder = Math.max(2, Number(data.relayCount || 0) + 1);
          input.placeholder = `${nextOrder}번째 이야기를 남겨주세요`;
        }

        if(data.relayCompleted){
          const completedUrl=`https://luxury-watch-app-111.vercel.app/?id=${encodeURIComponent(docId)}`;
          window.__lastShareUrl=completedUrl;
          window.setCompletedUI?.(Number(data.relayCount||0), completedUrl);
          window.showToast?.(`🏁 ${Number(data.relayCount||0)}명 릴레이 완성본`);
        }else{
          window.restoreActiveRelayUI?.();
          window.showToast?.('💌 새 이야기를 남겨주세요');
        }
      } catch (err) {
        console.error('Firestore Load Error:', err);
        window.showToast?.('❌ 데이터 로드 오류');
      }
    });
  </script>

  <style>

  <script>
    window.addEventListener('DOMContentLoaded',()=>setTimeout(()=>window.updateRelayBadge?.(),120));
    window.showToast = function(msg){
      const toast = document.getElementById('watchToast');
      toast.textContent = msg; toast.style.opacity = '1';
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(()=>toast.style.opacity='0',2500);
    };

    window.updateRelayBadge = function(){
      const badge=document.getElementById('relayBadge');
      const hint=document.getElementById('relayWritingHint');
      if(!badge)return;
      const count=Number(window.currentRelayCount||0);
      badge.style.display='block';

      if(window.relayCompleted){
        badge.textContent=`🏁 ${Math.max(1,count)}명 최종 완성`;
        if(hint) hint.textContent='완성된 릴레이 편지입니다';
      }else if(count>0){
        badge.textContent=`✉️ ${count+1}번째 편지 · 이전 → 나`;
        if(hint) hint.textContent=`${count+1}번째 편지를 이어 써보세요`;
      }else{
        badge.textContent='✉️ 첫 편지';
        if(hint) hint.textContent='한 줄을 남겨보세요';
      }
    };
    function setCompletedUI(count, url=''){
      const active=document.getElementById('relayActiveActions');
      const done=document.getElementById('relayCompletedActions');
      const title=document.getElementById('relayCompletedTitle');
      const linkBox=document.getElementById('savedLinkBox');
      const linkInput=document.getElementById('savedLinkInput');

      if(active) active.hidden=true;
      if(done) done.hidden=false;
      if(title) title.textContent=`🏁 ${Math.max(1,Number(count||0))}명 릴레이 완성`;

      if(url){
        window.__lastShareUrl=url;
        if(linkInput) linkInput.value=url;
      }
      if(linkBox) linkBox.hidden=true;
    }
    window.setCompletedUI=setCompletedUI;

    function restoreActiveRelayUI(){
      const active=document.getElementById('relayActiveActions');
      const done=document.getElementById('relayCompletedActions');
      if(active) active.hidden=false;
      if(done) done.hidden=true;
    }
    window.restoreActiveRelayUI=restoreActiveRelayUI;

    async function viewCompletedRelay(){
      const overlay=document.getElementById('completedRelayOverlay');
      const list=document.getElementById('completedRelayList');
      const title=document.getElementById('completedRelayOverlayTitle');

      if(!overlay || !list)return;

      const url=window.__lastShareUrl ||
        (window.__openedWatchId
          ? `https://luxury-watch-app-111.vercel.app/?id=${encodeURIComponent(window.__openedWatchId)}`
          : location.href);

      let finalId=window.__lastSavedDocId || window.__openedWatchId || '';
      if(!finalId){
        try{
          finalId=new URL(url).searchParams.get('id') || '';
        }catch(_){}
      }

      if(!finalId){
        window.showToast('완성본 ID를 찾지 못했습니다');
        return;
      }

      overlay.hidden=false;
      list.innerHTML='';
      if(title) title.textContent='완성본 불러오는 중...';

      try{
        const chain=await window.loadCompletedRelayChain?.(finalId);
        if(!Array.isArray(chain) || !chain.length){
          throw new Error('완성본 기록이 없습니다');
        }

        if(title) title.textContent=`🏁 ${chain.length}명 릴레이 완성본`;

        chain.forEach((item,index)=>{
          const card=document.createElement('section');
          card.className='completed-relay-card';

          const head=document.createElement('div');
          head.className='completed-relay-card-head';
          head.textContent=`${index+1}번째 편지`;
          card.appendChild(head);

          if(item.createdAt){
            const date=document.createElement('div');
            date.className='completed-relay-date';
            try{
              date.textContent=new Date(item.createdAt).toLocaleString('ko-KR');
            }catch(_){
              date.textContent='';
            }
            card.appendChild(date);
          }

          const body=document.createElement('div');
          body.className='completed-relay-text';
          body.textContent=(item.text || '').trim() || '글 없이 남긴 편지';
          card.appendChild(body);

          const media=document.createElement('div');
          media.className='completed-relay-media';

          if(item.audioUrl){
            const audio=document.createElement('audio');
            audio.controls=true;
            audio.preload='none';
            audio.src=item.audioUrl;
            media.appendChild(audio);
          }

          const bgItem=(Array.isArray(item.backgroundPlaylist) && item.backgroundPlaylist.length)
            ? item.backgroundPlaylist[0]
            : (item.backgroundUrl ? {url:item.backgroundUrl,type:item.backgroundType||'image'} : null);

          if(bgItem?.url){
            if(bgItem.type==='video'){
              const video=document.createElement('video');
              video.controls=true;
              video.preload='metadata';
              video.playsInline=true;
              video.src=bgItem.url;
              media.appendChild(video);
            }else{
              const img=document.createElement('img');
              img.loading='lazy';
              img.alt=`${index+1}번째 편지 배경`;
              img.src=bgItem.url;
              media.appendChild(img);
            }
          }

          if(media.childNodes.length) card.appendChild(media);
          list.appendChild(card);
        });

      }catch(err){
        console.error('Completed relay load error:',err);
        if(title) title.textContent='완성본을 불러오지 못했습니다';
        const msg=document.createElement('div');
        msg.className='completed-relay-error';
        msg.textContent='릴레이 기록을 다시 확인해주세요.';
        list.appendChild(msg);
      }
    }
    window.viewCompletedRelay=viewCompletedRelay;

    function closeCompletedRelay(){
      const overlay=document.getElementById('completedRelayOverlay');
      if(overlay) overlay.hidden=true;
      document.querySelectorAll('#completedRelayOverlay audio, #completedRelayOverlay video').forEach(el=>{
        try{el.pause();}catch(_){}
      });
    }
    window.closeCompletedRelay=closeCompletedRelay;

    async function copyCompletedLink(){
      await copySavedLink();
    }
    window.copyCompletedLink=copyCompletedLink;

    async function saveAndCreateLink(){
      if(window.relayCompleted){
        window.showToast('🏁 이미 완성된 릴레이입니다');
        return;
      }
      window.showToast('💾 저장하고 링크 만드는 중...');
      window.ensureCurrentSceneCaptured?.();
      await window.saveToFirestoreAndShare('save');
    }
    window.saveAndCreateLink=saveAndCreateLink;

    async function copySavedLink(){
      const url=window.__lastShareUrl || document.getElementById('savedLinkInput')?.value || '';
      if(!url){
        window.showToast('먼저 저장해서 링크를 만들어주세요');
        return;
      }
      try{
        if(navigator.clipboard && window.isSecureContext){
          await navigator.clipboard.writeText(url);
        }else{
          const ta=document.createElement('textarea');
          ta.value=url; ta.style.position='fixed'; ta.style.opacity='0';
          document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
        }
        window.showToast('📋 링크 복사 완료');
      }catch(err){
        console.error(err);
        prompt('아래 링크를 복사하세요:',url);
      }
    }
    window.copySavedLink=copySavedLink;

    async function shareSavedLink(){
      window.showToast('📨 공유 준비 중...');

      let url=window.__lastShareUrl || '';
      let message=window.__lastShareMessage || '';

      if(!url){
        await saveAndCreateLink();
        url=window.__lastShareUrl || '';
        message=window.__lastShareMessage || '';
      }

      if(!url){
        window.showToast('❌ 링크를 만들지 못했습니다');
        return;
      }

      const box=document.getElementById('savedLinkBox');
      const input=document.getElementById('savedLinkInput');
      if(input) input.value=url;
      if(box) box.hidden=false;

      if(!message){
        message=`[TIME RELAY · 이어쓰는 시계편지]\n\n👉 시계 열기:\n${url}`;
      }

      if(navigator.share){
        try{
          await navigator.share({
            title:'TIME RELAY · 이어쓰는 시계편지',
            text:message
          });
          window.showToast('💌 공유 완료');
          return;
        }catch(err){
          // 사용자가 공유창을 닫아도 링크는 화면에 남긴다.
          console.log('Web Share closed/fallback:', err?.name || err);
        }
      }

      try{
        await copySavedLink();
        window.showToast('📋 공유 링크를 복사했습니다');
      }catch(_){
        window.showToast('✅ 링크가 생성되었습니다');
      }
    }
    window.shareSavedLink=shareSavedLink;

    async function startRelayShare(){
      await shareSavedLink();
    }
    window.startRelayShare=startRelayShare;

    async function completeRelay(){
      const currentCount=Number(window.currentRelayCount||0);
      if(currentCount<1){
        window.showToast('먼저 편지를 다음 사람에게 전달해 릴레이를 시작하세요');
        return;
      }

      const currentText=(document.getElementById('dialContentInput')?.value||'').trim();
      if(!currentText && !window.recordedAudioBlob && !window.customBackgroundBlob && !window.screenRecordingBlob){
        window.showToast('마지막 이야기를 작성한 뒤 최종 완성해주세요');
        return;
      }

      window.ensureCurrentSceneCaptured?.();
      window.showToast('🏁 최종 완성 처리 중...');
      await window.saveToFirestoreAndShare('complete');
    }
    window.completeRelay=completeRelay;

    function setHandImageSource(source){
      ['hourGoldImg','minGoldImg','secGoldImg'].forEach(id=>{
        const img=document.getElementById(id);
        if(!img) return;
        img.classList.remove('hand-image-ready');
        img.removeAttribute('src');
        if(!source) return; // CSS gold fallback remains visible.
        img.onload=()=>{ img.classList.add('hand-image-ready'); };
        img.onerror=()=>{
          img.classList.remove('hand-image-ready');
          img.removeAttribute('src');
        };
        img.src=source;
      });
    }
    window.setHandImageSource=setHandImageSource;
    // Default startup uses the CSS gold fallback; no external/image decoding dependency.
    setHandImageSource('');


    window.__bgCurrent = document.getElementById('defaultBackground');

    function createBackgroundElement(source,type='image'){
      let el;
      if(type==='video'){
        el=document.createElement('video');
        el.autoplay=true; el.loop=true; el.muted=true; el.playsInline=true; el.preload='auto';
      }else{
        el=document.createElement('img');
        el.decoding='async';
      }
      el.className='bg-media-element';
      el.src=source;
      return el;
    }

    async function waitBackgroundReady(el,type){
      try{
        if(type==='video'){
          await new Promise(resolve=>{
            if(el.readyState>=2) return resolve();
            const done=()=>resolve();
            el.addEventListener('loadeddata',done,{once:true});
            setTimeout(done,2000);
          });
          await el.play().catch(()=>{});
        }else if(el.decode){
          await el.decode().catch(()=>{});
        }
      }catch(_){}
    }

    window.applyBackground = async function(source,type='image',instant=false){
      const layer=document.getElementById('backgroundLayer');
      const mode=document.getElementById('backgroundTransitionSelect')?.value||'soft';
      if(mode==='direct') instant=true;

      const oldEl=window.__bgCurrent;
      const newEl=createBackgroundElement(source,type);
      layer.appendChild(newEl);
      await waitBackgroundReady(newEl,type);

      if(instant || !oldEl){
        newEl.style.transition='none';
        newEl.classList.add('is-active');
        requestAnimationFrame(()=>newEl.style.transition='');
        if(oldEl && oldEl!==newEl){
          try{oldEl.pause?.();}catch(_){}
          oldEl.remove();
        }
      }else{
        newEl.getBoundingClientRect();
        requestAnimationFrame(()=>{
          newEl.classList.add('is-active');
          oldEl.classList.remove('is-active');
          oldEl.classList.add('is-leaving');
          setTimeout(()=>{
            try{oldEl.pause?.();}catch(_){}
            if(oldEl.parentNode===layer) oldEl.remove();
          },1350);
        });
      }
      window.__bgCurrent=newEl;
    };

    function clearBackgroundRotationTimer(){
      if(window.backgroundRotationTimer){
        clearInterval(window.backgroundRotationTimer);
        window.backgroundRotationTimer=null;
      }
    }

    async function showBackgroundAt(index,instant=false){
      const list=window.backgroundPlaylist||[];
      if(!list.length)return;
      window.backgroundRotationIndex=((index%list.length)+list.length)%list.length;
      const item=list[window.backgroundRotationIndex];
      await window.applyBackground(item.url,item.type||'image',instant);
    }

    function startBackgroundRotation(){
      clearBackgroundRotationTimer();
      const list=window.backgroundPlaylist||[];
      if(list.length<2)return;
      const sec=Number(document.getElementById('backgroundIntervalSelect')?.value||window.backgroundRotationSeconds||15);
      window.backgroundRotationSeconds=Math.max(5,sec);
      window.backgroundRotationTimer=setInterval(()=>{
        showBackgroundAt((window.backgroundRotationIndex||0)+1,false);
      },window.backgroundRotationSeconds*1000);
    }

    function toggleBackgroundRotation(){
      if(window.backgroundRotationTimer){
        clearBackgroundRotationTimer();
        window.showToast('⏸ 배경 자동전환 정지');
      }else{
        if((window.backgroundPlaylist||[]).length<2){
          window.showToast('이미지/영상을 2개 이상 선택하세요');
          return;

    function playSceneAudio(scene,index,onDone){
      let src=scene?.audioUrl||'';
      let objectUrl='';
      if(!src && index===window.storyScenes.length-1 && window.recordedAudioBlob?.size){
        try{
          objectUrl=URL.createObjectURL(window.recordedAudioBlob);
          src=objectUrl;
        }catch(_){}
      }
      if(!src){
        window.storyPlaybackTimer=setTimeout(onDone,4800);
        return;
      }
      try{
        const audio=new Audio(src);
        window.storyPlaybackAudio=audio;
        let finished=false;
        const finish=()=>{
          if(finished)return;
          finished=true;
          if(objectUrl)try{URL.revokeObjectURL(objectUrl);}catch(_){}
          window.storyPlaybackAudio=null;
          onDone();
        };
        audio.onended=finish;
        audio.onerror=()=>{ window.storyPlaybackTimer=setTimeout(finish,1500); };
        audio.play().then(()=>{
          window.storyPlaybackTimer=setTimeout(finish,18000);
        }).catch(()=>{
          window.storyPlaybackTimer=setTimeout(finish,4800);
        });
      }catch(_){
        window.storyPlaybackTimer=setTimeout(onDone,4800);
      }
    }

      window.storyPlaybackIndex=index;

    }

    // ---------- IndexedDB ----------
    const DB_NAME='LuxuryWatchStandardDB', STORE='media', DB_VERSION=1;
    function openDB(){
      return new Promise((resolve,reject)=>{
        const r=indexedDB.open(DB_NAME,DB_VERSION);
        r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains(STORE)) r.result.createObjectStore(STORE); };
        r.onsuccess=()=>resolve(r.result); r.onerror=()=>reject(r.error);
      });
    }
    async function dbPut(key,value){ const db=await openDB(); return new Promise((res,rej)=>{ const tx=db.transaction(STORE,'readwrite'); tx.objectStore(STORE).put(value,key); tx.oncomplete=()=>{db.close();res();}; tx.onerror=()=>{db.close();rej(tx.error);}; }); }
    async function dbGet(key){ const db=await openDB(); return new Promise((res,rej)=>{ const tx=db.transaction(STORE,'readonly'); const q=tx.objectStore(STORE).get(key); q.onsuccess=()=>{const v=q.result;db.close();res(v);}; q.onerror=()=>{db.close();rej(q.error);}; }); }

    function isMicEnvironmentAvailable() {
      const isLocalhost = ['localhost','127.0.0.1','::1'].includes(location.hostname);
      const isHttps = location.protocol === 'https:';
      return isLocalhost || isHttps;
    }

    function explainMicEnvironment() {
      return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
    }

    // ---------- 화면녹화 오디오 가져오기 ----------
    // MP4/MOV/WebM 파일에서 브라우저가 지원하는 오디오 트랙을 직접 재생한다.
    // 별도 재인코딩 없이 원본 컨테이너를 사용한다.

    // ---------- 녹음 v2.0.2 : Direct / Maximum Compatibility ----------
    // Web Audio 가공을 거치지 않고 마이크 스트림을 MediaRecorder에 직접 연결한다.
    // Chrome / Edge / Android / Safari 계열에서 재생 호환성을 우선한다.
    let mediaRecorder = null;
    let audioChunks = [];
    let recordingSourceStream = null;
    let currentAudio = null;
    let currentObjectUrl = null;

    function getBestRecordingOptions() {
      const candidates = [
        'audio/webm;codecs=opus',
        'audio/mp4',
        'audio/webm',
        'audio/ogg;codecs=opus'
      ];
      for (const mimeType of candidates) {
        try {
          if (window.MediaRecorder?.isTypeSupported?.(mimeType)) {
            return { mimeType, audioBitsPerSecond: 128000 };
          }
        } catch (_) {}
      }
      return {};
    }

    function setPlaybackUI(isPlaying){

    function cleanupCurrentAudio(){
      try{

    function stopMicTracks(){

    async function requestMicPermission(){
      if(location.protocol==='file:') return false;
      if(!isMicEnvironmentAvailable() || !navigator.mediaDevices?.getUserMedia) return false;

      const mode=document.getElementById('recordModeSelect')?.value||'voice';
      const audioConstraints=mode==='music'
        ? {
            echoCancellation:false,
            noiseSuppression:false,
            autoGainControl:false,
            channelCount:{ideal:2},
            sampleRate:{ideal:48000}
          }
        : {
            echoCancellation:true,
            noiseSuppression:true,
            autoGainControl:true,
            channelCount:1,
            sampleRate:{ideal:48000}
          };

      try{
        // This call opens the browser's own microphone permission dialog.
        const stream=await navigator.mediaDevices.getUserMedia({audio:audioConstraints});
        stream.getTracks().forEach(t=>t.stop());
        window.__micPermissionGranted=true;
        speakMicStreamReady=true;
        return true;
      }catch(err){
        window.__micPermissionGranted=false;
        console.error('Mic permission error:',err);
        return false;
      }
    }
    window.requestMicPermission=requestMicPermission;

    async function toggleRecording() {
      const recordBtn = document.getElementById('recordBtn');

      if (!explainMicEnvironment()) {
        return;
      }

      if (mediaRecorder && mediaRecorder.state === 'recording') {
        recordBtn.disabled = true;
        recordBtn.textContent = '처리 중...';
        try { mediaRecorder.requestData?.(); } catch (_) {}
        mediaRecorder.stop();
        return;
      }

      try {
        if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
          window.showToast('❌ 이 브라우저는 녹음을 지원하지 않습니다');
          return;
        }

        // 녹음 시작 시 브라우저의 기본 마이크 권한창을 직접 연다.
        if (!window.__micPermissionGranted) {
          const allowed = await requestMicPermission();
          if (!allowed) return;
        }

        cleanupCurrentAudio();
        window.recordedAudioBlob = null;
        window.recordedAudioSource = '';
        window.remoteAudioUrl = '';
        audioChunks = [];

        const recordMode = document.getElementById('recordModeSelect')?.value || 'voice';

        const audioConstraints = recordMode === 'music'
          ? {
              echoCancellation: false,
              noiseSuppression: false,
              autoGainControl: false,
              channelCount: { ideal: 2 },
              sampleRate: { ideal: 48000 }
            }
          : {
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true,
              channelCount: 1,
              sampleRate: { ideal: 48000 }
            };

        recordingSourceStream = await navigator.mediaDevices.getUserMedia({
          audio: audioConstraints
        });

        const opts = getBestRecordingOptions();
        try {
          mediaRecorder = Object.keys(opts).length
            ? new MediaRecorder(recordingSourceStream, opts)
            : new MediaRecorder(recordingSourceStream);
        } catch (_) {
          mediaRecorder = new MediaRecorder(recordingSourceStream);
        }

        mediaRecorder.ondataavailable = e => {
          if (e.data && e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onerror = e => {
          console.error('MediaRecorder error:', e);
          stopMicTracks();
          recordBtn.disabled = false;
          recordBtn.classList.remove('recording');
          recordBtn.textContent = '● 녹음';
          window.showToast('❌ 녹음 오류');
        };

        mediaRecorder.onstop = () => {
          const mime = mediaRecorder?.mimeType || audioChunks[0]?.type || 'audio/webm';
          const blob = new Blob(audioChunks, { type: mime });

          stopMicTracks();
          recordBtn.disabled = false;
          recordBtn.classList.remove('recording');
          recordBtn.textContent = '● 녹음';
          const quickVoiceBtn=document.getElementById('quickVoiceBtn');
          if(quickVoiceBtn){
            quickVoiceBtn.disabled=false;
            quickVoiceBtn.classList.remove('recording');
            quickVoiceBtn.textContent='🔴 목소리 녹음';
          }

          if (!blob.size) {
            window.recordedAudioBlob = null;
            window.showToast('❌ 녹음 데이터가 없습니다');
            return;
          }

          window.recordedAudioBlob = blob;
          window.recordedAudioSource = 'mic';
          window.remoteAudioUrl = '';

          const playBtn = document.getElementById('playAudioBtn');
          if (playBtn) {
            playBtn.style.display = 'block';
          const playbackControls=document.getElementById('audioPlaybackControls'); if(playbackControls) playbackControls.style.display='grid';
            playBtn.textContent = '▶ 녹음 재생';
          }

          const kb = Math.max(1, Math.round(blob.size / 1024));
          const finishedMode = document.getElementById('recordModeSelect')?.value || 'voice';
          window.showToast(`✅ ${finishedMode === 'music' ? '음악' : '목소리'} 녹음 완료 · ${kb}KB · 재생 버튼을 누르세요`);
        };

        // timeslice 없이 녹음하여 마지막 파일 헤더/메타데이터 호환성을 높임
        mediaRecorder.start();

        recordBtn.disabled = false;
        recordBtn.classList.add('recording');
        recordBtn.textContent = '■ 녹음 끝';
        const activeMode = document.getElementById('recordModeSelect')?.value || 'voice';
        window.showToast(activeMode === 'music'
          ? '🎵 음악 녹음 중 · 다른 휴대폰과 20~40cm 거리 권장'
          : '🔴 목소리 녹음 중입니다');

      } catch (err) {
        console.error('Mic start error:', err);
        stopMicTracks();
        recordBtn.disabled = false;
        recordBtn.classList.remove('recording');
        recordBtn.textContent = '● 녹음';

        if (err?.name === 'NotAllowedError' || err?.name === 'SecurityError') {
        } else {
          window.showToast('❌ 마이크 시작 실패');
        }
      }
    }
    window.toggleRecording = toggleRecording;

    async function playRecordedAudio() {
      cleanupCurrentAudio();

      let src = '';
      if (window.recordedAudioBlob?.size) {
        currentObjectUrl = URL.createObjectURL(window.recordedAudioBlob);
        src = currentObjectUrl;
      } else if (window.remoteAudioUrl) {
        src = window.remoteAudioUrl;
      }

      if (!src) {
        window.showToast('❌ 재생할 녹음소리가 없습니다');
        return;
      }

      try {
        currentAudio = document.getElementById('recordedAudioPlayer');
        if (!currentAudio) {
          currentAudio = document.createElement('audio');
          currentAudio.id = 'recordedAudioPlayer';
          currentAudio.playsInline = true;
          currentAudio.preload = 'auto';
          currentAudio.style.display = 'none';
          document.body.appendChild(currentAudio);
        }

        currentAudio.pause();
        currentAudio.src = src;
        currentAudio.volume = 1;
        currentAudio.muted = false;
        currentAudio.load();

        // 재생 버튼 자체의 사용자 클릭 이벤트 안에서 바로 play() 호출.
        const promise = currentAudio.play();
        if (promise) await promise;

        setPlaybackUI(true);
        window.showToast('🔊 재생 중');

        currentAudio.onended = () => {
          setPlaybackUI(false);
          window.showToast('✅ 재생 완료');
        };
        currentAudio.onerror = () => {
          setPlaybackUI(false);
          console.error('audio element error:', currentAudio.error);
          window.showToast('❌ 이 파일의 소리 형식을 재생할 수 없습니다 · MP4/AAC 권장');
        };
      } catch (err) {
        setPlaybackUI(false);
        console.error('Recorded audio playback failed:', err);
        window.showToast(
          err?.name === 'NotAllowedError'
            ? '❌ 화면을 한 번 누른 뒤 다시 재생하세요'
            : '❌ 녹음 재생 실패'
        );
      }
    }

    // ---------- Legacy AI narrator code retained only for backward compatibility; UI disabled ---------- AI 편지 내레이터 v1.5 ----------
    // 기본: Vercel /api/tts -> OpenAI TTS MP3
    // 실패 시: 브라우저 speechSynthesis fallback
    let narrationUtterance = null;
    let currentNarratorAudio = null;
    let narratorRequestController = null;
    let cachedNarratorVoices = [];
    const NARRATOR_STYLE_VERSION = 'pro-voice-v1';
    window.aiNarratorStyleVersion = '';
    window.aiNarratorCacheKey = '';

    function refreshNarratorVoices(){
      if(!('speechSynthesis' in window)) return [];
      cachedNarratorVoices = speechSynthesis.getVoices() || [];
      return cachedNarratorVoices;
    }

    function getKoreanVoices(){
      return refreshNarratorVoices().filter(v =>
        /^ko(?:-|_)/i.test(v.lang || '') || /korean|한국/i.test(v.name || '')
      );
    }

    function chooseFallbackVoice(gender){
      const ko = getKoreanVoices();
      if(!ko.length) return null;
      const maleHints = ['male','man','minsu','minjun','injoon','hyunsu','seojun','woojin','남성','남자'];
      const femaleHints = ['female','woman','yuna','sora','sunhi','heami','yuri','seoyeon','jiyeon','여성','여자'];
      const hints = gender === 'male' ? maleHints : femaleHints;
      return ko.find(v => hints.some(h => (v.name || '').toLowerCase().includes(h.toLowerCase())))
        || (gender === 'female' ? ko[0] : null);
    }

    function makeWarmNarrationText(rawText){
      return rawText
        .replace(/\r\n/g, '\n')
        .replace(/\n{2,}/g, '. ')
        .replace(/\n/g, ', ')
        .replace(/([.!?])\s*/g, '$1  ')
        .replace(/,{2,}/g, ',')
        .replace(/\s{3,}/g, '  ')
        .trim();
    }

    function stopNarration(){
      try { narratorRequestController?.abort(); } catch(_) {}
      narratorRequestController = null;

      if(currentNarratorAudio){
        try { currentNarratorAudio.pause(); currentNarratorAudio.currentTime = 0; } catch(_) {}
        currentNarratorAudio = null;
      }

      if('speechSynthesis' in window){
        try { speechSynthesis.cancel(); } catch(_) {}
      }

      window.showToast('■ 내레이터 정지');
    }

    async function browserNarratorFallback(rawText, gender, mood='warm'){
      if(!('speechSynthesis' in window)){
        window.showToast('❌ AI 음성 생성 실패');
        return;
      }

      try { speechSynthesis.resume(); } catch(_) {}
      speechSynthesis.cancel();

      narrationUtterance = new SpeechSynthesisUtterance(makeWarmNarrationText(rawText));
      narrationUtterance.lang = 'ko-KR';
      narrationUtterance.volume = 1.0;
      const moodRate = mood === 'calm' ? 0.88 : (mood === 'bright' ? 1.00 : 0.94);
      narrationUtterance.rate = moodRate;
      narrationUtterance.pitch = gender === 'male' ? 0.90 : 1.03;

      const voice = chooseFallbackVoice(gender);
      if(voice) narrationUtterance.voice = voice;

      narrationUtterance.onstart = () =>
        window.showToast('📱 브라우저 예비 음성으로 재생 중');
      narrationUtterance.onend = () =>
        window.showToast('💌 내레이터 읽기 완료');
      narrationUtterance.onerror = () =>
        window.showToast('❌ 내레이터 재생 오류');

      setTimeout(() => {
        try {
          speechSynthesis.resume();
          speechSynthesis.speak(narrationUtterance);
        } catch(_) {
          window.showToast('❌ 내레이터 실행 실패');
        }
      }, 80);
    }

    async function unlockChimeAudio(){
      try{
        const AC=window.AudioContext||window.webkitAudioContext;
        if(!AC)return false;
        if(!chimeAudioContext||chimeAudioContext.state==='closed') chimeAudioContext=new AC();
        if(chimeAudioContext.state==='suspended') await chimeAudioContext.resume();
        return true;
      }catch(e){

      }

    function stopCuckooChime(){

    }

    async function playCuckooChime(){
      try{
        if(!(await unlockChimeAudio())) throw new Error('audio context unavailable');
        stopCuckooChime();
        const ctx=chimeAudioContext;
        const start=ctx.currentTime+0.04;
        const master=ctx.createGain();
        const filter=ctx.createBiquadFilter();
        filter.type='lowpass';
        filter.frequency.value=1800;
        filter.Q.value=0.6;
        master.gain.value=0.85;
        filter.connect(master);
        master.connect(ctx.destination);
        activeChimeNodes.push(master,filter);

        // 실제 뻐꾸기 울음처럼 부드럽게 내려가는 두 음(장3도 근처)을 사용.
        const notes=[
          {t:0.00,f:783.99,d:0.28,g:0.22}, // G5
          {t:0.31,f:622.25,d:0.36,g:0.25}  // Eb5
        ];
        notes.forEach(n=>{
          const osc1=ctx.createOscillator();
          const osc2=ctx.createOscillator();
          const gain=ctx.createGain();
          osc1.type='sine';
          osc2.type='triangle';
          osc1.frequency.setValueAtTime(n.f,start+n.t);
          osc2.frequency.setValueAtTime(n.f*2,start+n.t);
          const t0=start+n.t, t1=t0+n.d;
          gain.gain.setValueAtTime(0.0001,t0);
          gain.gain.exponentialRampToValueAtTime(n.g,t0+0.035);
          gain.gain.exponentialRampToValueAtTime(n.g*0.55,t0+0.12);
          gain.gain.exponentialRampToValueAtTime(0.0001,t1);
          osc1.connect(gain); osc2.connect(gain); gain.connect(filter);
          osc1.start(t0); osc2.start(t0);
          osc1.stop(t1+0.02); osc2.stop(t1+0.02);
          activeChimeNodes.push(osc1,osc2,gain);
        });
        setTimeout(()=>{activeChimeNodes=[];},850);
        return true;
      }catch(e){
        console.error('Cuckoo chime error',e);
        window.showToast('🕰️ 뻐꾸기 재생 실패 · 화면을 한 번 터치 후 다시 테스트하세요');
        return false;
      }
    }

    function makeDraggable(handle,target,{isMenu=false}={}){
      if(!handle||!target) return;
      let active=false,startX=0,startY=0,startLeft=0,startTop=0,moved=false,pointerId=null;
      handle.addEventListener('pointerdown',e=>{
        if(e.button!==undefined && e.button!==0) return;
        const dial=document.getElementById('dialSunray');
        if(!dial) return;
        const d=dial.getBoundingClientRect();
        const t=target.getBoundingClientRect();
        active=true; moved=false; pointerId=e.pointerId;
        startX=e.clientX; startY=e.clientY;
        startLeft=t.left-d.left; startTop=t.top-d.top;
        try{ handle.setPointerCapture(pointerId); }catch(_){ }
        if(target.classList.contains('calendar-window')) target.classList.add('dragging');
      },{passive:true});
      handle.addEventListener('pointermove',e=>{
        if(!active || e.pointerId!==pointerId) return;
        const dx=e.clientX-startX, dy=e.clientY-startY;
        if(Math.hypot(dx,dy)>5) moved=true;
        if(!moved) return;
        e.preventDefault();
        const dial=document.getElementById('dialSunray');
        if(!dial) return;
        const d=dial.getBoundingClientRect();
        const r=target.getBoundingClientRect();
        const maxLeft=Math.max(0,d.width-r.width);
        const maxTop=Math.max(0,d.height-r.height);
        setElementPosition(target,clamp(startLeft+dx,0,maxLeft),clamp(startTop+dy,0,maxTop));
      },{passive:false});
      const finish=e=>{
        if(!active || (e.pointerId!==undefined && e.pointerId!==pointerId)) return;
        active=false;
        try{ handle.releasePointerCapture(pointerId); }catch(_){ }
        target.classList.remove('dragging');
        if(moved){
          if(isMenu){
            window.__suppressMenuClickUntil=Date.now()+300;
            requestAnimationFrame(relayoutOpenMenus);
          }
          saveUIPositionsLocal();
          window.showToast?.('📌 위치 저장');
        }
        pointerId=null;
      };
      handle.addEventListener('pointerup',finish);
      handle.addEventListener('pointercancel',finish);
    }

    function clampPanelIntoDial(panel, desiredLeft, desiredTop){
      const dial=document.getElementById('dialSunray');
      const controls=document.querySelector('.top-controls');
      if(!dial||!controls||!panel) return;

      const d=dial.getBoundingClientRect();
      const c=controls.getBoundingClientRect();
      const p=panel.getBoundingClientRect();

      const minLeft=d.left-c.left+4;
      const maxLeft=d.right-c.left-p.width-4;
      const minTop=d.top-c.top+4;
      const maxTop=d.bottom-c.top-p.height-4;

      panel.style.left=`${clamp(desiredLeft,minLeft,Math.max(minLeft,maxLeft))}px`;
      panel.style.top=`${clamp(desiredTop,minTop,Math.max(minTop,maxTop))}px`;
    }

    function layoutMainMenu(){
      const dial=document.getElementById('dialSunray');
      const controls=document.querySelector('.top-controls');
      const panel=document.getElementById('mainMenuPanel');
      if(!dial||!controls||!panel||panel.hidden) return;

      const d=dial.getBoundingClientRect();
      const c=controls.getBoundingClientRect();
      const p=panel.getBoundingClientRect();

      const roomRight=d.right-(c.left+40);
      const roomLeft=c.left-d.left;
      const openRight=roomRight>=p.width+8 || roomRight>=roomLeft;
      const desiredLeft=openRight ? 39 : -p.width+1;

      const roomBelow=d.bottom-c.top;
      const roomAbove=c.bottom-d.top;
      const openDown=roomBelow>=p.height+4 || roomBelow>=roomAbove;
      const desiredTop=openDown ? 0 : 40-p.height;

      panel.dataset.openSide=openRight?'right':'left';
      panel.dataset.openVertical=openDown?'down':'up';
      clampPanelIntoDial(panel,desiredLeft,desiredTop);
    }

    function layoutSubMenu(panelId){
      const dial=document.getElementById('dialSunray');
      const controls=document.querySelector('.top-controls');
      const main=document.getElementById('mainMenuPanel');
      const panel=document.getElementById(panelId);
      if(!dial||!controls||!main||!panel||panel.hidden) return;

      const d=dial.getBoundingClientRect();
      const c=controls.getBoundingClientRect();
      const m=main.getBoundingClientRect();
      const p=panel.getBoundingClientRect();

      // 메인 메뉴가 오른쪽에 열리면 서브 메뉴도 우측, 왼쪽이면 좌측으로 우선 배치
      const side=main.dataset.openSide || 'right';
      let globalLeft = side==='right' ? m.right+4 : m.left-p.width-4;

      // 해당 버튼 행 근처에서 열되, 큰 패널은 시계 안에 전부 보이도록 자동 보정
      const rowOffsets={backgroundPanel:0,soundPanel:40,saveSharePanel:80};
      let globalTop=m.top+(rowOffsets[panelId]||0);

      // 반대쪽에 공간이 더 많으면 자동 반전
      if(globalLeft+p.width>d.right-4){ globalLeft=m.left-p.width-4; }
      if(globalLeft<d.left+4){ globalLeft=m.right+4; }

      // 편지·장면 메뉴는 높이가 크므로 아래가 잘리지 않게 먼저 위로 당긴다.
      if((panelId==='letterPanel' || panelId==='soundPanel') && globalTop+p.height>d.bottom-6){
        globalTop=Math.max(d.top+6,d.bottom-p.height-6);
      }

      const desiredLeft=globalLeft-c.left;
      const desiredTop=globalTop-c.top;
      clampPanelIntoDial(panel,desiredLeft,desiredTop);
    }

    async function blobToBase64(blob){
      const buffer=await blob.arrayBuffer();
      const bytes=new Uint8Array(buffer);
      let binary='';
      const step=0x8000;
      for(let i=0;i<bytes.length;i+=step){
        binary += String.fromCharCode(...bytes.subarray(i,i+step));
      }
      return btoa(binary);
    }

    function appendTranscribedText(text){
      const input=document.getElementById('dialContentInput');
      if(!input)return;

      const cleaned=String(text||'').trim();
      if(!cleaned)return;

      const before=input.value.trim();
      input.value=before ? `${before}\n${cleaned}` : cleaned;
      window.__currentContributionStarted = true;
      input.dispatchEvent(new Event('input',{bubbles:true}));
      input.scrollTop=input.scrollHeight;
    }

    async function transcribeSpeechBlob(blob){
      setSpeakWriteButton(false,true);
      setSpeechStatus('글로 바꾸는 중...');

      try{
        const audioBase64=await blobToBase64(blob);
        const transcribeApiUrl = location.protocol === 'file:'
          ? 'https://luxury-watch-app-111.vercel.app/api/transcribe'
          : '/api/transcribe';

        const response=await fetch(transcribeApiUrl,{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({
            audioBase64,
            mimeType:blob.type||'audio/webm'
          })
        });

        const data=await response.json().catch(()=>({}));
        if(!response.ok){
          throw new Error(data?.error||`HTTP ${response.status}`);
        }

        const text=String(data?.text||'').trim();
        if(!text){
          setSpeechStatus('말을 인식하지 못했습니다',true);
          return;
        }

        appendTranscribedText(text);
        setSpeechStatus('✓ 글로 작성되었습니다');
        setTimeout(()=>setSpeechStatus(''),1600);

      }catch(err){
        console.error('Transcription error:',err);
        const msg=String(err?.message||'').trim();
        if(msg.includes('OPENAI_API_KEY')){
          setSpeechStatus('OpenAI API Key 설정을 확인해주세요',true);
        }else if(msg.includes('insufficient_quota') || msg.toLowerCase().includes('quota')){
          setSpeechStatus('OpenAI API 결제/크레딧을 확인해주세요',true);
        }else if(msg.includes('401') || msg.toLowerCase().includes('invalid api key')){
          setSpeechStatus('OpenAI API Key가 유효하지 않습니다',true);
        }else if(msg.includes('404')){
          setSpeechStatus('/api/transcribe 배포를 확인해주세요',true);
        }else{
          setSpeechStatus(msg ? `오류: ${msg.slice(0,90)}` : '음성→글 서버 오류',true);
        }
      }finally{
        setSpeakWriteButton(false,false);
      }
    }

    async function toggleSpeakToWrite(){
      if(speechWriteActive && speechWriteRecorder){
        setSpeakWriteButton(false,true);
        setSpeechStatus('글로 바꾸는 중...');
        try{
          if(speechWriteRecorder.state==='recording'){
            speechWriteRecorder.stop();
          }
        }catch(err){
          console.error('Speech write stop error:',err);
          speechWriteActive=false;
          stopSpeechWriteTracks();
          setSpeakWriteButton(false,false);
        }
        return;
      }

      if(!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder){
        setSpeechStatus('이 브라우저에서는 이용할 수 없습니다',true);
        return;
      }

      setSpeechStatus('');
      setSpeakWriteButton(false,true);

      try{
        speechWriteStream=await navigator.mediaDevices.getUserMedia({
          audio:{
            echoCancellation:true,
            noiseSuppression:true,
            autoGainControl:true,
            channelCount:1,
            sampleRate:{ideal:48000}
          }
        });

        speechWriteChunks=[];

        let options={};
        if(MediaRecorder.isTypeSupported?.('audio/webm;codecs=opus')){
          options={mimeType:'audio/webm;codecs=opus'};
        }else if(MediaRecorder.isTypeSupported?.('audio/webm')){
          options={mimeType:'audio/webm'};
        }

        speechWriteRecorder=new MediaRecorder(speechWriteStream,options);

        speechWriteRecorder.ondataavailable=e=>{
          if(e.data && e.data.size>0) speechWriteChunks.push(e.data);
        };

        speechWriteRecorder.onerror=e=>{
          console.error('Speech write recorder error:',e);
          speechWriteActive=false;
          stopSpeechWriteTracks();
          setSpeakWriteButton(false,false);
          setSpeechStatus('녹음을 다시 시작해주세요',true);
        };

        speechWriteRecorder.onstop=async ()=>{
          const mime=speechWriteRecorder?.mimeType||'audio/webm';
          const blob=new Blob(speechWriteChunks,{type:mime});
          speechWriteChunks=[];
          speechWriteActive=false;
          speechWriteRecorder=null;
          stopSpeechWriteTracks();

          if(!blob.size){
            setSpeakWriteButton(false,false);
            setSpeechStatus('말을 다시 들려주세요',true);
            return;
          }

          await transcribeSpeechBlob(blob);
        };

        speechWriteRecorder.start(250);
        speechWriteActive=true;
        setSpeakWriteButton(true,false);
        setSpeechStatus('말씀하세요…');

        speechWriteTimer=setTimeout(()=>{
          if(speechWriteActive && speechWriteRecorder?.state==='recording'){
            speechWriteRecorder.stop();
          }
        },SPEECH_WRITE_MAX_MS);

      }catch(err){
        console.error('Speech write start error:',err);
        speechWriteActive=false;
        stopSpeechWriteTracks();
        setSpeakWriteButton(false,false);

        if(err?.name==='NotAllowedError' || err?.name==='SecurityError'){
          setSpeechStatus('마이크 권한을 허용해주세요',true);
        }else{
          setSpeechStatus('마이크를 시작할 수 없습니다',true);
        }
      }
    }

    window.toggleSpeakToWrite=toggleSpeakToWrite;

    async function quickToggleVoiceRecord(){
      const quick=document.getElementById('quickVoiceBtn');
      const isRecording=mediaRecorder && mediaRecorder.state==='recording';
      if(quick){
        quick.disabled=true;
        quick.textContent=isRecording ? '처리 중...' : '마이크 준비...';
      }
      await toggleRecording();
      setTimeout(()=>{
        const recordingNow=mediaRecorder && mediaRecorder.state==='recording';
        if(quick){
          quick.disabled=false;
          quick.textContent=recordingNow ? '■ 녹음 끝' : '🔴 목소리 녹음';
          quick.classList.toggle('recording',!!recordingNow);
        }
      },180);
    }
    window.quickToggleVoiceRecord=quickToggleVoiceRecord;


    function openCompactWriter(mode='text'){
      const writer=document.getElementById('compactWriter');
      const title=document.getElementById('compactWriterTitle');
      const speechBtn=document.getElementById('compactSpeechBtn');
      const input=document.getElementById('dialContentInput');
      if(!writer)return;

      writer.hidden=false;

      // 공유받은 사람은 "자기 글을 실제로 쓰기 시작하기 전"까지
      // 글쓰기 창을 열 때마다 반드시 빈 칸으로 시작한다.
      // 이전 작성자의 text가 어떤 경로로 화면에 남아 있어도 여기서 제거한다.
      if(window.__isSharedRelayPage && input && !window.__currentContributionStarted){
        input.value='';
        const nextOrder=Math.max(2,Number(window.currentRelayCount||0)+1);
        input.placeholder=`${nextOrder}번째 이야기를 남겨주세요`;
      }

      if(mode==='speech'){
        if(title) title.textContent='말로 글쓰기';
        if(speechBtn){
          speechBtn.hidden=false;
          speechBtn.textContent='🎙 말하기 시작';
        }
      }else{
        if(title) title.textContent='직접 글쓰기';
        if(speechBtn) speechBtn.hidden=true;
        setTimeout(()=>input?.focus(),60);
      }
    }

    function closeCompactWriter(){
      const writer=document.getElementById('compactWriter');
      if(writer) writer.hidden=true;
    }

    window.openCompactWriter=openCompactWriter;

    // 기본 새 편지는 첫 작성자 상태
    if(!new URLSearchParams(location.search).get('id')){
      window.__incomingRelay=false;
      window.__isSharedRelayPage=false;
      window.__currentContributionStarted=false;
      window.previousRelayText='';
    }
    window.closeCompactWriter=closeCompactWriter;

    // ---------- 메뉴 ----------
    function toggleControlPanel(panelId,event){
      if(window.__suppressMenuClickUntil && Date.now()<window.__suppressMenuClickUntil){ event?.preventDefault(); event?.stopPropagation(); return; }
      event?.stopPropagation();
      const target=document.getElementById(panelId);
      const btn=document.getElementById('mainMenuBtn');
      const open=target.hidden;
      document.querySelectorAll('.control-panel').forEach(p=>p.hidden=true);
      target.hidden=!open;
      btn?.classList.toggle('opened',open);
      if(open) requestAnimationFrame(layoutMainMenu);
    }
    function toggleSubPanel(panelId,event){
      event?.stopPropagation();
      const target=document.getElementById(panelId);
      const open=target.hidden;
      ['backgroundPanel','soundPanel','saveSharePanel'].forEach(id=>{
        const el=document.getElementById(id);
        if(el) el.hidden=true;
      });
      target.hidden=!open;
      if(open) requestAnimationFrame(()=>{ layoutMainMenu(); layoutSubMenu(panelId); });
    }
    document.addEventListener('click',e=>{
      if(!e.target.closest('.top-controls')){
        document.querySelectorAll('.control-panel').forEach(p=>p.hidden=true);
        document.getElementById('mainMenuBtn')?.classList.remove('opened');
      }
    });

    // ---------- 스타일 ----------
    const contentInput=document.getElementById('dialContentInput');
    document.getElementById('fontFamilySelect').addEventListener('change',e=>contentInput.style.fontFamily=e.target.value);
    window.updateStorySceneUI?.();
    document.getElementById('fontSizeSelect').addEventListener('change',e=>contentInput.style.fontSize=e.target.value);
    document.getElementById('textColorPicker').addEventListener('input',e=>contentInput.style.color=e.target.value);
    document.getElementById('backgroundIntervalSelect')?.addEventListener('change',e=>{
      window.backgroundRotationSeconds=Number(e.target.value||15);
      if((window.backgroundPlaylist||[]).length>1) startBackgroundRotation();
      window.showToast(`⏱ 배경 전환 ${window.backgroundRotationSeconds}초`);
    });
    document.getElementById('backgroundTransitionSelect')?.addEventListener('change',e=>{
      window.showToast(e.target.value==='soft' ? '✨ 부드러운 전환' : '⚡ 바로 전환');
    });

    // ---------- 크기 ----------
    const scaler=document.getElementById('scalerElement');
    function resizeWatch(){ if(innerWidth<=600){scaler.style.transform='none';return;} const scale=Math.min((innerWidth*.94)/380,(innerHeight*.94)/530); scaler.style.transform=`scale(${scale})`; }
    addEventListener('resize',resizeWatch); resizeWatch();

    // ---------- 시계 ----------
    contentInput.addEventListener('input', (event) => {
      // 실제 사용자가 글을 쓰거나 음성→글 결과가 들어온 뒤부터는
      // 그 사람의 현재 초안을 유지한다.
      if(window.__incomingRelay && contentInput.value.trim()){
        window.__currentContributionStarted = true;
      }
      window.aiNarratorBlob = null;
      window.remoteNarratorAudioUrl = '';
      window.__lastShareUrl='';
      window.__lastShareMessage='';
      const box=document.getElementById('savedLinkBox');
      if(box) box.hidden=true;
    });

    const hourHand=document.getElementById('mainHourHand'),minHand=document.getElementById('mainMinuteHand'),secPivot=document.getElementById('secondHandPivot'),secondMeteoriteWrap=document.getElementById('secondMeteoriteWrap');
    const hourNumText=document.getElementById('hourNumText'),minNumText=document.getElementById('minNumText');
    const calYearMonth=document.getElementById('calYearMonth'),calDay=document.getElementById('calDay'),calDate=document.getElementById('calDate');
    const monthNames=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'],dayNames=['SUN','MON','TUE','WED','THU','FRI','SAT'];
    function tickWatch(){
      const now=new Date(),h=now.getHours(),m=now.getMinutes(),s=now.getSeconds(),ms=now.getMilliseconds();
      checkHourlyChime(now);
      const secAngle=-((s+ms/1000)/60)*360,minAngle=((m+s/60)/60)*360,hourAngle=(((h%12)+m/60)/12)*360;
      secPivot.style.transform=`rotate(${secAngle}deg)`; minHand.style.transform=`rotate(${minAngle}deg)`; hourHand.style.transform=`rotate(${hourAngle}deg)`;
      secondMeteoriteWrap.style.transform=`translate(-50%,-50%) rotate(${-secAngle}deg)`;
      hourNumText.innerText=h%12===0?12:h%12; minNumText.innerText=String(m).padStart(2,'0');
      hourNumText.style.transform=`rotate(-${hourAngle}deg)`; minNumText.style.transform=`rotate(-${minAngle}deg)`;
      calYearMonth.innerText=`${now.getFullYear()} ${monthNames[now.getMonth()]}`; calDay.innerText=dayNames[now.getDay()]; calDate.innerText=String(now.getDate()).padStart(2,'0');
      requestAnimationFrame(tickWatch);
    }
    requestAnimationFrame(tickWatch);
  </script>

  <button type="button" id="appInfoButton" class="app-info-button" onclick="openAppInfo()">ⓘ 정보</button>

      <div class="completed-relay-sheet-head">
        <h2 id="completedRelayOverlayTitle">🏁 릴레이 완성본</h2>
        <button type="button" onclick="closeCompletedRelay()">×</button>
      </div>
      <div id="completedRelayList" class="completed-relay-list"></div>
      <button type="button" class="completed-relay-close" onclick="closeCompletedRelay()">닫기</button>
    </div>

      <h3 id="copyrightModalTitle">저작권 및 미디어 사용 안내</h3>
      <div id="copyrightModalBody"></div>
      <div class="modal-actions">
        <button type="button" class="btn-custom" onclick="closeCopyrightModal()">닫기</button>

    </div>
  </div>
